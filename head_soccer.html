    g.putImageData(id, 0, 0); return c;
  }

  // ------------------------------------------------------------------- crowd
  layoutCrowd() {
    const rnd = makeRng(4242); this.people = [];
    const rows = [
      { y: 40, k: 0.42, n: 84, tier: 0 }, { y: 60, k: 0.5, n: 74, tier: 0 },
      { y: 92, k: 0.64, n: 62, tier: 1 }, { y: 112, k: 0.74, n: 54, tier: 1 },
    ];
    rows.forEach((row, ri) => {
      for (let i = 0; i < row.n; i++) {
        const x = (i + 0.2 + rnd() * 0.6) * (W / row.n);
        if (row.tier === 0 && row.y < 62 && x > W / 2 - 84 && x < W / 2 + 84 && ri === 0) continue;
        this.people.push({ x, y: row.y + (rnd() - 0.5) * 2, k: row.k, c: Math.floor(rnd() * 99), v: Math.floor(rnd() * 4), ph: rnd() * 6.28, f: rnd() * 1.6, eager: 0.2 + rnd() * 0.8, seat: rnd() < 0.3, row: ri });
      }
    });
    this.flags = [{ x: 150, c: 0 }, { x: 330, c: 1 }, { x: 570, c: 0 }, { x: 760, c: 1 }];
  }

  drawCrowd(ctx, view, par) {
    const t = this.time, ex = view.excite, cel = view.celebrating;
    const wavePhase = (t % 34) / 34, waveOn = wavePhase < 0.17 && !cel;
    const front = (wavePhase / 0.17) * (W + 240) - 120;
    const cc = this.atlas.length;
    for (const p of this.people) {
      const ci = (p.c * 7 + p.row) % cc;
      let pose = 0;
      const wave = waveOn && Math.abs(p.x - front) < 42;
      if (cel) pose = p.eager > 0.28 ? 2 : 0;
      else if (wave) pose = 2;
      else if (ex > 0.55 && p.eager > 0.62) pose = 2;
      else if (p.seat && ex < 0.35) pose = 1;
      const amp = cel ? 5.5 : (0.5 + ex * 3.2) * p.eager + (wave ? 3 : 0);
      const hop = Math.abs(Math.sin(t * (cel ? 8.5 + p.f * 2 : 2 + p.f * 1.2) + p.ph)) * amp * (pose === 1 ? 0.2 : 1);
      const spr = this.atlas[ci][p.v][pose];
      const w = 16 * p.k, h = 24 * p.k;
      ctx.drawImage(spr.canvas, p.x + par - w / 2, p.y - h - hop, w, h);
    }
    // waving flags in team colours
    this.flags.forEach((f, i) => {
      const col = this.crowdColors[f.c % this.crowdColors.length], x0 = f.x + par, y0 = 58;
      ctx.strokeStyle = '#cfd3da'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y0 - 30); ctx.stroke();
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x0, y0 - 30);
      const amp = 1.5 + ex * 3 + (cel ? 3 : 0);
      for (let s = 0; s <= 8; s++) ctx.lineTo(x0 + s * 2.6, y0 - 30 + Math.sin(t * 6 + s * 0.8 + i) * amp);
      for (let s = 8; s >= 0; s--) ctx.lineTo(x0 + s * 2.6, y0 - 20 + Math.sin(t * 6 + s * 0.8 + i) * amp);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x0 + 1, y0 - 27, 8, 1.4);
    });
  }

  drawJumbotron(ctx, view, par) {
    const x = W / 2 - 74 + par, y = 14, w = 148, h = 34, m = view.match;
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    const goalFlash = m && m.goalFlash > 0;
    g.addColorStop(0, goalFlash ? '#3a2a05' : '#0f2e22'); g.addColorStop(1, goalFlash ? '#1f1602' : '#081a13');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; for (let i = 0; i < h; i += 3) ctx.fillRect(x, y + i, w, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (m && m.phase !== 'ended') {
      if (goalFlash && Math.floor(this.time * 6) % 2 === 0) { ctx.fillStyle = '#f4d76b'; ctx.font = "700 20px 'Oswald', Arial, sans-serif"; ctx.fillText('¡GOOOL!', x + w / 2, y + h / 2); }
      else {
        ctx.fillStyle = '#e8f5ee'; ctx.font = "700 15px 'Oswald', Arial, sans-serif";
        ctx.fillText(`${m.clubL.code}  ${m.scoreL} - ${m.scoreR}  ${m.clubR.code}`, x + w / 2, y + 12);
        ctx.fillStyle = '#e8b84b'; ctx.font = "600 11px 'Oswald', Arial, sans-serif"; ctx.fillText(m.overtime ? 'GOL DE ORO' : formatClock(m.timeLeft), x + w / 2, y + 26);
      }
    } else { ctx.fillStyle = '#e8b84b'; ctx.font = "700 16px 'Oswald', Arial, sans-serif"; ctx.fillText('CABEZAZO', x + w / 2, y + h / 2); }
    ctx.textBaseline = 'alphabetic';
  }

  drawAds(ctx, par) {
    const msgs = ['CABEZAZO', 'LIGA DE LOS 24', 'FAIR PLAY', 'COPA CABEZAZO', 'GOLAZO TV', 'TURBO BOOTS', 'PRO ARENA'];
    const adW = W / 9, base = Math.floor(this.time / 4);
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = "600 9px 'Oswald', Arial, sans-serif"; ctx.textAlign = 'center';
    for (let i = 0; i < 9; i++) ctx.fillText(msgs[(i + base) % msgs.length], i * adW + adW / 2 + par, STAND_H + 10);
  }

  // ------------------------------------------------------------------- goals
  drawGoalNet(ctx, side) {
    const left = side === 'left';
    const x0 = left ? BACK_L : MOUTH_R, x1 = left ? MOUTH_L : BACK_R;           // x0 < x1 always
    const nb = this.net[side];
    const amt = nb ? (nb.t / nb.max) * 12 : 0, dir = left ? -1 : 1;
    const disp = y => nb ? dir * amt * Math.max(0, 1 - Math.abs(y - nb.y) / 70) : 0;
    const back = ctx.createLinearGradient(x0, 0, x1, 0);
    back.addColorStop(left ? 0 : 1, 'rgba(0,0,0,0.34)'); back.addColorStop(left ? 1 : 0, 'rgba(0,0,0,0.04)');
    ctx.fillStyle = back; ctx.fillRect(x0, CROSSBAR_Y, x1 - x0, GROUND_Y - CROSSBAR_Y);
    ctx.lineWidth = 0.9;
    ctx.strokeStyle = 'rgba(236,240,244,0.5)';
    const cols = 8, rows = 10;
    for (let i = 0; i <= cols; i++) {
      const gx = x0 + (x1 - x0) * (i / cols);
      ctx.beginPath(); ctx.moveTo(gx, CROSSBAR_Y);
      for (let s = 1; s <= rows; s++) { const yy = CROSSBAR_Y + (GROUND_Y - CROSSBAR_Y) * (s / rows); ctx.lineTo(gx + disp(yy), yy); }
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(236,240,244,0.42)';
    for (let j = 0; j <= rows; j++) { const gy = CROSSBAR_Y + (GROUND_Y - CROSSBAR_Y) * (j / rows), d = disp(gy); ctx.beginPath(); ctx.moveTo(x0 + d, gy); ctx.lineTo(x1 + d, gy); ctx.stroke(); }
  }
  drawGoalFrame(ctx, side) {
    const left = side === 'left';
    const xa = left ? BACK_L : MOUTH_R, xb = left ? MOUTH_L : BACK_R;
    const pg = x => { const g = ctx.createLinearGradient(x - 3, 0, x + 3, 0); g.addColorStop(0, '#aeb4bc'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, '#c4cad2'); return g; };
    ctx.fillStyle = pg(xa); ctx.fillRect(xa - 2.5, CROSSBAR_Y - CROSSBAR_R, 5, GROUND_Y - CROSSBAR_Y + CROSSBAR_R);
    ctx.fillStyle = pg(xb); ctx.fillRect(xb - 3, CROSSBAR_Y - CROSSBAR_R, 6, GROUND_Y - CROSSBAR_Y + CROSSBAR_R);
    const bg = ctx.createLinearGradient(0, CROSSBAR_Y - 4, 0, CROSSBAR_Y + 4); bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#9aa1ab');
    ctx.fillStyle = bg; ctx.fillRect(Math.min(xa, xb) - 3, CROSSBAR_Y - CROSSBAR_R, Math.abs(xb - xa) + 6, CROSSBAR_R * 2);
  }

  // ------------------------------------------------------------------ bodies
  drawPlayer(ctx, p, a) {
    if (!p.club) return;
    const spr = this.character(p.club), bt = this.boot(p.club), R = p.R, dir = p.dir;
    const x = lerp(p.px, p.x, a), y = lerp(p.py, p.y, a);
    const fx = lerp(p.pfx, p.fx, a), fy = lerp(p.pfy, p.fy, a);
    const hx = p.hipX + (x - p.x), hy = p.hipY + (y - p.y);

    ctx.globalAlpha = 0.85 * (1 - clamp(height / 260, 0, 0.7));

    ctx.strokeStyle = p.club.colors[0]; ctx.lineWidth = 6.6; ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy - 3); ctx.stroke();
    ctx.strokeStyle = p.club.trim; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(kx - 3, ky + 2); ctx.lineTo(kx + 3, ky + 2); ctx.stroke();
    // body sprite with squash & stretch, lean, run-bob and breathing
    const idle = p.onGround && Math.abs(p.vx) < 0.6;
    const breathe = idle ? 1 + Math.sin(this.time * 3 + (dir > 0 ? 0 : 1.7)) * 0.012 : 1;
    const bob = p.onGround && Math.abs(p.vx) > 1 ? Math.abs(Math.sin(p.runPhase * 1.0)) * 1.8 : 0;
    const swing = p.kickT >= 0 ? (swingParams(p.kickT).theta - 0.12) * 0.1 * dir : 0;
    ctx.save();
    ctx.translate(x, y + R + LEG_BASE - bob);
    ctx.rotate(p.lean + swing);
    ctx.scale(p.sx * dir, p.sy * breathe);
    ctx.drawImage(spr.canvas, -spr.ox, -(R + LEG_BASE) - spr.oy, spr.w, spr.h);
    ctx.restore();

    ctx.drawImage(bt.canvas, -bt.ox, -bt.oy, bt.w, bt.h); ctx.restore();

      const k = (p.kickT - TUNE.K_WIND) / TUNE.K_STRIKE;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(255,255,255,${0.35 * (1 - k * 0.4)})`; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); const bx = hx + dir * Math.sin(-0.5) * 30, by = hy + Math.cos(-0.5) * 30; ctx.moveTo(bx, by); ctx.quadraticCurveTo(hx + dir * 24, hy + 28, fx - dir * 3, fy); ctx.stroke(); ctx.restore();
    }
  }

  drawBall(ctx, ball, a) {
    const R = BALL_R, x = lerp(ball.px, ball.x, a), y = lerp(ball.py, ball.y, a);
    const spr = ball.gold ? this.ballSpr.g : this.ballSpr.w;
    // trail ribbon
    const tr = this.trail;
    if (tr.length > 2) {
      ctx.lineCap = 'round';
      for (let i = 1; i < tr.length; i++) {
        const f = i / tr.length, s = clamp((tr[i].s - 4) / 9, 0, 1);
        if (s <= 0.02) continue;
        ctx.strokeStyle = ball.gold ? `rgba(244,200,90,${0.5 * f * s})` : `rgba(235,242,255,${0.45 * f * s})`;
        ctx.lineWidth = R * 1.5 * f * (0.5 + s * 0.5);
        ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y); ctx.stroke();
      }

    ctx.globalAlpha = 0.8 * (1 - clamp(h / 300, 0, 0.7));
    ctx.drawImage(this.shadowSpr, x + 5 + h * 0.1 - sw / 2, GROUND_Y - 3, sw, sw * 0.28); ctx.globalAlpha = 1;
    ctx.save(); ctx.translate(x, y);
    const sp = Math.hypot(ball.vx, ball.vy), va = Math.atan2(ball.vy, ball.vx), st = 1 + Math.min(0.32, sp * 0.016);
    if (sp > 1) { ctx.rotate(va); ctx.scale(st, 1 / Math.sqrt(st)); ctx.rotate(-va); }
    if (ball.squash > 0.02) { ctx.rotate(ball.squashAng); ctx.scale(1 - ball.squash * 0.35, 1 + ball.squash * 0.25); ctx.rotate(-ball.squashAng); }
    const S = spr.size;
    ctx.save(); ctx.rotate(ball.angle); ctx.drawImage(spr.tex, -S / 2, -S / 2, S, S); ctx.restore();

  }

  // ------------------------------------------------------------------- frame
  draw(view, a) {

    ctx.save();

    ctx.drawImage(this.far, -MARGIN + par, -MARGIN, W + MARGIN * 2, TOP_LIMIT + MARGIN);
    this.drawJumbotron(ctx, view, par);
    this.drawCrowd(ctx, view, par * 1.35);
    this.drawAds(ctx, par);
    ctx.drawImage(this.pitch, -MARGIN, TOP_LIMIT, W + MARGIN * 2, H - TOP_LIMIT + MARGIN);
    // light shafts
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const s of [{ x: 60, t: 0.3 }, { x: W - 60, t: -0.3 }]) {
      const gr = ctx.createLinearGradient(s.x, TOP_LIMIT, s.x + s.t * 340, GROUND_Y); gr.addColorStop(0, 'rgba(255,250,220,0.1)'); gr.addColorStop(1, 'rgba(255,250,220,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(s.x - 26, TOP_LIMIT); ctx.lineTo(s.x + 26, TOP_LIMIT); ctx.lineTo(s.x + s.t * 340 + 90, GROUND_Y); ctx.lineTo(s.x + s.t * 340 - 90, GROUND_Y); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    this.drawGoalNet(ctx, 'left'); this.drawGoalNet(ctx, 'right');
    // draw the farther-from-camera body first: left, right (no depth, but stable ordering)
    this.drawPlayer(ctx, world.left, a); this.drawPlayer(ctx, world.right, a);
    this.drawBall(ctx, ball, a);
    this.drawGoalFrame(ctx, 'left'); this.drawGoalFrame(ctx, 'right');
    view.particles.draw(ctx);
    ctx.restore();
    // ---- screen space ----
    ctx.drawImage(this.overlay, 0, 0, W, H);
    if (!this.grainPat) this.grainPat = ctx.createPattern(this.grain, 'repeat');
    ctx.save(); ctx.globalAlpha = 0.5; ctx.translate(Math.random() * 128, Math.random() * 128); ctx.fillStyle = this.grainPat; ctx.fillRect(-128, -128, W + 256, H + 256); ctx.restore();
    if (view.slow < 0.9) { const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.8); v.addColorStop(0, 'rgba(255,200,80,0)'); v.addColorStop(1, `rgba(255,190,60,${(0.9 - view.slow) * 0.28})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); }
    this.drawHud(ctx, view);
  }

  drawHud(ctx, view) {
    const m = view.match; if (!m) return;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (m.phase === 'countdown' || m.phase === 'overtimeIntro') {
      const n = m.countNum, label = n > 0 ? String(n) : 'GO!';
      const k = m.countFrac, sc = 1 + 0.45 * (1 - easeOut(k));
      ctx.save(); ctx.translate(W / 2, H * 0.4); ctx.scale(sc, sc); ctx.globalAlpha = clamp(1.4 - k, 0, 1);
      ctx.font = "800 118px 'Oswald', Impact, Arial, sans-serif"; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.strokeText(label, 0, 0);
      const g = ctx.createLinearGradient(0, -50, 0, 50); g.addColorStop(0, '#fff6c9'); g.addColorStop(1, '#e8b84b'); ctx.fillStyle = g; ctx.fillText(label, 0, 0); ctx.restore();
      if (m.phase === 'overtimeIntro') { ctx.font = "700 22px 'Oswald', Arial, sans-serif"; ctx.fillStyle = '#f4d76b'; ctx.fillText('TIEMPO EXTRA — GOL DE ORO', W / 2, H * 0.4 + 82); }
    }
    if (m.goalFlash > 0) {
      const k = 1 - m.goalFlash / 80, slide = easeOut(clamp(k * 4, 0, 1)), alpha = clamp(m.goalFlash / 18, 0, 1);
      const bw = 330, bh = 54, bx = W / 2 - bw / 2, by = TOP_LIMIT + 38 - (1 - slide) * 30;
      ctx.save(); ctx.globalAlpha = alpha * slide;
      ctx.fillStyle = 'rgba(6,8,13,0.9)'; ctx.fillRect(bx, by, bw, bh);
      const sc = m.goalClub; const gr = ctx.createLinearGradient(bx, 0, bx + 8, 0); gr.addColorStop(0, sc.colors[0]); gr.addColorStop(1, sc.colors[1]); ctx.fillStyle = gr; ctx.fillRect(bx, by, 8, bh);
      ctx.fillStyle = '#e8b84b'; ctx.font = "800 26px 'Oswald', Arial, sans-serif"; ctx.fillText('¡GOL!', bx + 66, by + bh / 2 + 1);
      ctx.fillStyle = '#fff'; ctx.font = "700 17px 'Oswald', Arial, sans-serif"; ctx.textAlign = 'left'; ctx.fillText(m.goalLabel, bx + 118, by + bh / 2 + 1); ctx.textAlign = 'center';

    }

  }
}


/* ======================================================================
 * 10 — UI: tiny DOM builder + reusable components. No innerHTML for logic,
 * handlers are attached directly, so there are no fragile selector lookups.
 * ==================================================================== */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))); }
  return e;
}

function crest(club, size = 40) {
  return h('div', { class: 'crest-shield', style: `width:${size}px;height:${Math.round(size * 1.12)}px;background:${club.pattern}` },
    h('span', { style: `font-size:${Math.max(6, size * 0.27)}px` }, club.code));
}

function cupSVG(c1, c2, ribbon, big) {
  const s = big ? 1 : 0.8;
  return `<svg viewBox="0 0 60 78" width="${Math.round(52 * s)}" height="${Math.round(68 * s)}">
    <defs><linearGradient id="cg${c1.slice(1)}" x1="0" x2="1"><stop offset="0" stop-color="${c2}"/><stop offset="0.45" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="M14 8h32v16c0 11-7 19-16 19S14 35 14 24z" fill="url(#cg${c1.slice(1)})" stroke="${c2}" stroke-width="1.2"/>
    <path d="M14 12H6c0 11 4 17 11 19M46 12h8c0 11-4 17-11 19" fill="none" stroke="${c1}" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M24 12v15" stroke="rgba(255,255,255,.45)" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="27" y="43" width="6" height="10" fill="${c2}"/><path d="M19 53h22l3 7H16z" fill="${c1}" stroke="${c2}" stroke-width="1"/>
    ${ribbon ? `<path d="M22 22l8 6 8-6v9l-8 6-8-6z" fill="${ribbon}" opacity="0.9"/>` : ''}
    <rect x="12" y="60" width="36" height="10" rx="2" fill="${big ? '#5a371f' : '#4a2f1b'}"/>
    ${big ? '<rect x="22" y="63" width="16" height="4.5" rx="1" fill="#e8b84b"/>' : ''}
  </svg>`;
}

const DIFFS = [
  { id: 'facil', label: 'Fácil', c1: '#b9773f', c2: '#7d4d24' },
  { id: 'normal', label: 'Normal', c1: '#d5dae2', c2: '#8d95a3' },
  { id: 'dificil', label: 'Difícil', c1: '#f0cb55', c2: '#b9892a' },
  { id: 'imposible', label: 'Imposible', c1: '#ffe27a', c2: '#c79a1d', big: true },
];
const diffById = id => DIFFS.find(d => d.id === id) || DIFFS[0];

function difficultyList(selected, onChange) {
  const root = h('div', { class: 'diff-list' });
  const rows = [];
  const paint = () => rows.forEach(r => r.el.classList.toggle('selected', r.id === selected));
  DIFFS.forEach(d => {
    const el = h('button', { class: 'diff-row', type: 'button', onclick: () => { selected = d.id; paint(); onChange(d.id); } },
      h('span', { class: 'diff-cup', html: cupSVG(d.c1, d.c2, null, false) }),
      h('span', { class: 'diff-radio' }),
      h('span', { class: 'diff-label' }, d.label.toUpperCase()),
      h('span', { class: 'diff-hint' }, { facil: 'Copa de bronce', normal: 'Copa de plata', dificil: 'Copa de oro', imposible: 'Copa de oro de campeón' }[d.id]));
    rows.push({ id: d.id, el }); root.appendChild(el);
  });
  paint(); return root;
}

// character preview: the SAME sprite used in the match, so the choice never "changes"
function characterPreview(club, spriteFn, bootFn) {
  const spr = spriteFn(club), bt = bootFn(club), k = 2.0, padB = 16;
  const c = h('canvas', { width: Math.round(spr.w * 2 * k), height: Math.round((spr.h + padB) * 2 * k), style: `width:${Math.round(spr.w * k)}px;height:${Math.round((spr.h + padB) * k)}px` });
  const g = c.getContext('2d');
  g.scale(2 * k, 2 * k);
  g.drawImage(spr.canvas, 0, 0, spr.w, spr.h);
  g.drawImage(bt.canvas, spr.ox + 5 - bt.ox, spr.oy + 39 - bt.oy, bt.w, bt.h);
  return c;
}

function carousel(startIdx, spriteFn, bootFn, onIndex) {
  let idx = startIdx || 0;
  const card = h('div', { class: 'carousel-card' });
  const counter = h('div', { class: 'carousel-count' });
  const render = () => {
    const c = CLUBS[idx];
    card.innerHTML = '';
    card.appendChild(h('div', { class: 'carousel-top' }, crest(c, 50)));
    card.appendChild(h('div', { class: 'carousel-char' }, characterPreview(c, spriteFn, bootFn)));
    card.appendChild(h('div', { class: 'carousel-name' }, c.name));
    card.appendChild(h('div', { class: 'carousel-code' }, c.code));
    counter.textContent = `${idx + 1} / ${CLUBS.length}`;
    if (onIndex) onIndex(idx, c);
  };
  const move = d => { idx = (idx + d + CLUBS.length) % CLUBS.length; render(); };
  const root = h('div', { class: 'carousel-wrap' },
    h('button', { class: 'arrow-btn', type: 'button', 'aria-label': 'Anterior', onclick: () => { Audio.sfx.click(); move(-1); } }, '‹'),
    h('div', { class: 'carousel-mid' }, card, counter),
    h('button', { class: 'arrow-btn', type: 'button', 'aria-label': 'Siguiente', onclick: () => { Audio.sfx.click(); move(1); } }, '›'));
  render();
  return { root, move, get index() { return idx; }, get club() { return CLUBS[idx]; } };
}

function versusRow(a, b, spriteFn, bootFn) {
  const side = c => h('div', { class: 'vs-side' }, characterPreview(c, spriteFn, bootFn), crest(c, 34), h('div', { class: 'vs-name' }, c.name));
  return h('div', { class: 'vs-row' }, side(a), h('div', { class: 'vs-mid' }, 'VS'), side(b));
}

// ---- full single-elimination bracket (octavos -> final), always all 4 rounds
function bracketSVG(bracket) {
  const matchH = 29, boxW = 140, boxH = 23;
  const colX = [6, 196, 386, 576], names = ['OCTAVOS', 'CUARTOS', 'SEMIFINAL', 'FINAL'];
  const data = [];
  for (let r = 0; r < 4; r++) data.push(bracket.rounds[r] ? bracket.rounds[r].matches : new Array([8, 4, 2, 1][r]).fill(null).map(() => ({ a: null, b: null, score: null })));
  const y0 = data[0].map((_, i) => 24 + i * matchH + boxH / 2);
  const y1 = data[1].map((_, i) => (y0[i * 2] + y0[i * 2 + 1]) / 2);
  const y2 = data[2].map((_, i) => (y1[i * 2] + y1[i * 2 + 1]) / 2);
  const ys = [y0, y1, y2, [(y2[0] + y2[1]) / 2]];
  const totalW = colX[3] + boxW + 8, totalH = y0[7] + boxH / 2 + 8;
  let s = `<svg viewBox="0 0 ${totalW} ${totalH}" width="${totalW}" height="${totalH}" role="img" aria-label="Cuadro de eliminatorias">`;
  for (let r = 0; r < 3; r++) for (let i = 0; i < ys[r + 1].length; i++) {
    const a = ys[r][i * 2], b = ys[r][i * 2 + 1], m = ys[r + 1][i], x1 = colX[r] + boxW, x2 = colX[r + 1], xm = (x1 + x2) / 2;
    s += `<path d="M${x1},${a} H${xm} M${x1},${b} H${xm} M${xm},${a} V${b} M${xm},${m} H${x2}" stroke="#39404f" stroke-width="1.5" fill="none"/>`;
  }
  for (let r = 0; r < 4; r++) {
    s += `<text x="${colX[r] + boxW / 2}" y="12" fill="#8b94a7" font-family="Oswald,Arial" font-weight="600" font-size="9" text-anchor="middle" letter-spacing="1.5">${names[r]}</text>`;
    data[r].forEach((m, i) => {
      const cy = ys[r][i], isUser = r === bracket.roundIdx && i === bracket.userIdx, x = colX[r];
      const A = m.a ? clubById(m.a) : null, B = m.b ? clubById(m.b) : null;
      s += `<rect x="${x}" y="${cy - boxH / 2}" width="${boxW}" height="${boxH}" rx="4" fill="${isUser ? 'rgba(232,184,75,0.13)' : 'rgba(255,255,255,0.035)'}" stroke="${isUser ? '#e8b84b' : '#2c3342'}"/>`;
      s += `<line x1="${x}" x2="${x + boxW}" y1="${cy}" y2="${cy}" stroke="${isUser ? '#e8b84b' : '#2c3342'}" stroke-width="0.7"/>`;
      const row = (C, yy, sc, win) => {
        let t = '';
        if (C) t += `<rect x="${x + 5}" y="${yy - 7}" width="9" height="9" rx="2" fill="${C.colors[0]}" stroke="rgba(255,255,255,.35)" stroke-width=".6"/>`;
        t += `<text x="${x + 19}" y="${yy + 1}" fill="${C ? (win ? '#ffffff' : '#c8cfdc') : '#4b5365'}" font-family="Oswald,Arial" font-weight="${win ? 700 : 600}" font-size="10">${C ? C.code : '???'}</text>`;
        if (sc != null) t += `<text x="${x + boxW - 7}" y="${yy + 1}" fill="#e8b84b" font-family="Oswald,Arial" font-weight="700" font-size="10" text-anchor="end">${sc}</text>`;
        return t;
      };
      const sc = m.score ? m.score.split('-') : [null, null];
      s += row(A, cy - 6, sc[0], m.winner && m.winner === m.a) + row(B, cy + 6.5, sc[1], m.winner && m.winner === m.b);
    });
  }
  return h('div', { class: 'bracket-scroll', html: s + '</svg>' });
}

// ---- trophy cabinet: wooden shelves + wall decoration
function trophyCabinet(trophies) {
  const per = 5, shelves = Math.max(3, Math.ceil(trophies.length / per));
  const counts = { facil: 0, normal: 0, dificil: 0, imposible: 0 };
  trophies.forEach(t => { counts[t.difficulty] = (counts[t.difficulty] || 0) + 1; });
  const root = h('div', { class: 'cabinet-wrap' });
  root.appendChild(h('div', { class: 'cabinet-stats' }, DIFFS.map(d => h('div', { class: 'cab-stat' }, h('span', { class: 'cab-cup', html: cupSVG(d.c1, d.c2, null, false) }), h('b', null, '×' + counts[d.id])))));
  const cab = h('div', { class: 'cabinet' });
  cab.appendChild(h('div', { class: 'cabinet-deco' },
    h('span', { class: 'frame', html: '<svg viewBox="0 0 44 32" width="44" height="32"><rect x="1" y="1" width="42" height="30" rx="2" fill="#1f5a34" stroke="#c9a46a" stroke-width="2"/><path d="M22 3v26M3 16h38" stroke="#e8f0e8" stroke-width="1"/><circle cx="22" cy="16" r="5" fill="none" stroke="#e8f0e8" stroke-width="1"/></svg>' }),
    h('span', { class: 'scarf', html: '<svg viewBox="0 0 70 18" width="70" height="18"><rect width="70" height="18" rx="3" fill="#1a2a5e"/><rect x="8" width="7" height="18" fill="#7d1935"/><rect x="24" width="7" height="18" fill="#7d1935"/><rect x="40" width="7" height="18" fill="#7d1935"/><rect x="56" width="7" height="18" fill="#7d1935"/></svg>' }),
    h('span', { class: 'frame', html: '<svg viewBox="0 0 36 40" width="36" height="40"><rect x="1" y="1" width="34" height="38" rx="2" fill="#10141f" stroke="#c9a46a" stroke-width="2"/><path d="M8 30l4-14 6 6 6-10 4 18z" fill="#c8102e"/><circle cx="18" cy="11" r="4" fill="#f0c9a0"/></svg>' })));
  for (let s = 0; s < shelves; s++) {
    const row = h('div', { class: 'shelf-row' });
    for (let i = 0; i < per; i++) {
      const t = trophies[s * per + i];
      if (!t) { row.appendChild(h('div', { class: 'slot empty' })); continue; }
      const d = diffById(t.difficulty), c = clubById(t.clubId);
      row.appendChild(h('div', { class: 'slot', title: `${c.name} — ${d.label}` },
        h('div', { html: cupSVG(d.c1, d.c2, t.difficulty === 'imposible' ? c.colors[0] : null, !!d.big) }),
        h('div', { class: 'slot-label' }, c.code, h('br'), h('span', null, d.label))));
    }
    cab.appendChild(row); cab.appendChild(h('div', { class: 'plank' }));
  }
  root.appendChild(cab);
  if (!trophies.length) root.appendChild(h('p', { class: 'cab-empty' }, 'Todavía no ganaste ningún campeonato. ¡Tu primera copa irá en el primer estante!'));
  return root;
}


/* ======================================================================
 * 11 — GAME: loop, match state machine, effects wiring, screens, tournament
 *  Loop: fixed 60 Hz simulation (accumulator) + interpolated rendering,
 *        hit-stop and slow-motion are applied on top of the accumulator.
 * ==================================================================== */
const KEYMAP = {
  LEFT: { left: 'KeyA', right: 'KeyD', jump: 'KeyW', kick: ['KeyS', 'KeyT', 'KeyV'] },
  RIGHT: { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', kick: ['ArrowDown', 'KeyP', 'KeyM'] },
  SOLO: { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', kick: ['Space'] },
};
const ZERO = Object.freeze({ left: false, right: false, jump: false, kick: false });

const Store = {
  async load() {
    try { if (window.storage) { const r = await window.storage.get('cabezazo_trophies'); return r && r.value ? JSON.parse(r.value) : []; } } catch (e) { }
    try { const v = window.localStorage.getItem('cabezazo_trophies'); return v ? JSON.parse(v) : []; } catch (e) { }
    return [];
  },
  async save(list) {
    const s = JSON.stringify(list);
    try { if (window.storage) { await window.storage.set('cabezazo_trophies', s); return; } } catch (e) { }
    try { window.localStorage.setItem('cabezazo_trophies', s); } catch (e) { }
  },
};

const Game = (() => {
  const $ = id => document.getElementById(id);
  const canvas = $('game');
  const renderer = new Renderer(canvas);
  const particles = new ParticleSystem(), camera = new Camera(), world = new World();
  const keys = Object.create(null);
  const spriteFn = c => renderer.character(c), bootFn = c => renderer.boot(c);

  // ---- state --------------------------------------------------------------
  let match = null, paused = false, demo = false, demoCool = 0, demoAI = null;
  let mode = null, difficulty = 'facil', userClubId = null, lastPick = 0, left2p = null, right2p = null, bracket = null, trophies = [];
  let controllers = { left: null, right: null };
  let acc = 0, last = performance.now(), time = 0, timeScale = 1, slowTimer = 0, hitStop = 0, excite = 0;
  let activeCarousel = null, ended = false;

  // ---- DOM ----------------------------------------------------------------
  const ov = { root: $('overlay'), title: $('overlay-title'), sub: $('overlay-sub'), content: $('overlay-content'), buttons: $('overlay-buttons') };
  const sb = { root: $('scoreboard'), pill: $('round-pill'), c1: $('crest1'), c2: $('crest2'), code1: $('team1-code'), code2: $('team2-code'), s1: $('scoreLeft'), s2: $('scoreRight'), timer: $('timer'), touch: $('touch') };
  const btnPause = $('btn-pause'), btnHelp = $('btn-help'), btnMute = $('btn-mute');

  function show({ title = '', sub = '', content = null, buttons = [], mode: m = '' }) {
    ov.root.classList.toggle('loading-mode', m === 'loading');
    ov.title.textContent = title; ov.sub.textContent = sub; ov.sub.style.display = sub ? '' : 'none';
    ov.content.innerHTML = '';
    if (content) (Array.isArray(content) ? content : [content]).forEach(c => ov.content.appendChild(c));
    ov.buttons.innerHTML = '';
    let first = null;
    buttons.forEach(b => {
      const el = h('button', { class: 'btn' + (b.secondary ? ' btn-secondary' : ''), type: 'button', onclick: () => { Audio.init(); Audio.sfx.click(); b.onClick(); } }, b.label);
      ov.buttons.appendChild(el); if (!first && !b.secondary) first = el;
    });
    ov.root.classList.add('show'); ov.root.setAttribute('aria-hidden', 'false');
    if (first) try { first.focus({ preventScroll: true }); } catch (e) { }
  }
  function hideOverlay() { ov.root.classList.remove('show'); ov.root.classList.remove('loading-mode'); ov.root.setAttribute('aria-hidden', 'true'); }
  const overlayOpen = () => ov.root.classList.contains('show');

  // ---- idle / demo scenes ---------------------------------------------------
  function setHeroes(a, b) { world.left.club = a; world.right.club = b; renderer.character(a); renderer.character(b); renderer.boot(a); renderer.boot(b); }
  function idleScene() {
    world.resetKickoff(); world.ballHeld = true; world.ball.reset(W / 2, GROUND_Y - BALL_R);
    world.left.input = world.right.input = Object.assign({}, ZERO); particles.clear(); renderer.clearTrail();
  }
  function startDemo() {
    demo = true; demoCool = 0; world.resetKickoff(); world.ballHeld = false;
    demoAI = { left: new AIController('dificil'), right: new AIController('dificil') };
  }

  // ---- screens ------------------------------------------------------------
  function screenSplash() {
    match = null; hideScoreboard(); setHeroes(clubById('barcelona'), clubById('realmadrid')); startDemo();
    show({
      mode: 'loading', title: 'CABEZAZO', sub: 'El torneo de los 24 grandes',
      content: h('div', { class: 'splash-tags' }, h('span', null, '24 clubes'), h('span', null, 'Campeonato por llaves'), h('span', null, 'Vitrina de trofeos')),
      buttons: [{ label: 'Iniciar', onClick: () => { Audio.init(); Audio.startMusic(); demo = false; screenMenu(); } }],
    });
  }
  function modeCard(icon, title, sub, onClick) {
    return h('button', { class: 'mode-card', type: 'button', onclick: () => { Audio.init(); Audio.sfx.click(); onClick(); } },
      h('div', { class: 'mode-icon', html: icon }), h('div', { class: 'mode-title' }, title), h('div', { class: 'mode-sub' }, sub));
  }
  function screenMenu() {
    endMatchState(); idleScene(); setHeroes(clubById('barcelona'), clubById('realmadrid')); Audio.startMusic(); activeCarousel = null;
    show({
      title: 'CABEZAZO', sub: 'Elegí cómo querés jugar',
      content: [
        h('div', { class: 'menu-cards' },
          modeCard(ICONS.solo, '1 Jugador', 'Campeonato vs CPU', () => { mode = '1p'; screenDifficulty(); }),
          modeCard(ICONS.duo, '2 Jugadores', 'Amistoso local 1 vs 1', () => { mode = '2p'; screenPick2p('left'); })),
        h('div', { class: 'ticker-wrap' }, h('div', { class: 'ticker' }, 'CABEZAZO — TORNEO DE LOS 24 GRANDES — ELEGÍ TU CLUB — GANÁ LA COPA — LLENÁ LA VITRINA — CABEZAZO — TORNEO DE LOS 24 GRANDES —')),
      ],
      buttons: [{ label: 'Vitrina de trofeos', secondary: true, onClick: screenTrophies }],
    });
  }
  function screenDifficulty() {
    activeCarousel = null;
    show({
      title: 'Nivel de dificultad', sub: 'La copa que ganes en la vitrina depende del nivel',
      content: difficultyList(difficulty, v => { difficulty = v; Audio.sfx.click(); }),
      buttons: [{ label: 'Siguiente', onClick: () => screenPick1p() }, { label: 'Volver', secondary: true, onClick: screenMenu }],
    });
  }
  function screenPick1p() {
    const car = carousel(lastPick, spriteFn, bootFn, i => { lastPick = i; }); activeCarousel = car;
    show({
      title: 'Elegí tu club', sub: 'Jugarás todo el campeonato con este equipo', content: car.root,
      buttons: [{ label: 'Elegir este club', onClick: () => { userClubId = car.club.id; activeCarousel = null; startTournament(); } }, { label: 'Volver', secondary: true, onClick: screenDifficulty }],
    });
  }
  function screenPick2p(side) {
    const car = carousel(side === 'left' ? 9 : 5, spriteFn, bootFn); activeCarousel = car;
    show({
      title: side === 'left' ? 'Jugador izquierdo' : 'Jugador derecho',
      sub: side === 'left' ? 'Controles: A / D mover · W saltar · S, T o V patear' : 'Controles: ← / → mover · ↑ saltar · ↓, P o M patear', content: car.root,
      buttons: [
        { label: 'Elegir este club', onClick: () => { activeCarousel = null; if (side === 'left') { left2p = car.club.id; screenPick2p('right'); } else { right2p = car.club.id; screenReady2p(); } } },
        { label: 'Volver', secondary: true, onClick: () => side === 'left' ? screenMenu() : screenPick2p('left') },
      ],
    });
  }
  function screenReady2p() {
    const a = clubById(left2p), b = clubById(right2p);
    show({
      title: 'Partido amistoso', sub: '1 minuto. Gana quien meta más goles; si hay empate, gol de oro.', content: versusRow(a, b, spriteFn, bootFn),
      buttons: [{ label: 'Comenzar partido', onClick: launch2p }, { label: 'Cambiar equipos', secondary: true, onClick: () => screenPick2p('left') }],
    });
  }
  function screenTrophies() {
    activeCarousel = null;
    show({ title: 'Vitrina de trofeos', sub: 'Tus campeonatos ganados, por dificultad', content: trophyCabinet(trophies), buttons: [{ label: 'Volver al menú', onClick: screenMenu }] });
  }

  // ---- tournament ---------------------------------------------------------
  function startTournament() {
    const others = shuffle(CLUBS.map(c => c.id).filter(id => id !== userClubId)).slice(0, 15);
    const pool = shuffle(others.concat([userClubId]));          // fresh random draw every time a tournament starts
    const matches = [];
    for (let i = 0; i < 16; i += 2) matches.push({ a: pool[i], b: pool[i + 1], winner: null, score: null });
    bracket = { userClub: userClubId, rounds: [{ name: 'Octavos de final', matches }], roundIdx: 0, userIdx: matches.findIndex(m => m.a === userClubId || m.b === userClubId) };
    screenBracket();
  }
  const roundNames = ['Octavos de final', 'Cuartos de final', 'Semifinal', 'Final'];
  function opponentId() { const m = bracket.rounds[bracket.roundIdx].matches[bracket.userIdx]; return m.a === bracket.userClub ? m.b : m.a; }
  function screenBracket() {
    const r = bracket.rounds[bracket.roundIdx], opp = clubById(opponentId());
    show({
      title: r.name, sub: `Tu rival: ${opp.name} (${opp.code}) · Dificultad ${diffById(difficulty).label}`, content: bracketSVG(bracket),
      buttons: [{ label: 'Jugar partido', onClick: launch1p }, { label: 'Menú', secondary: true, onClick: screenMenu }],
    });
  }
  function randomScore() { let a = Math.floor(Math.random() * 4), b = Math.floor(Math.random() * 4); if (a === b) { if (Math.random() < 0.5 && a > 0) a--; else b++; } return [a, b]; }
  function tournamentWin(uGoals, oGoals) {
    const r = bracket.rounds[bracket.roundIdx], um = r.matches[bracket.userIdx], userIsA = um.a === bracket.userClub;
    um.winner = bracket.userClub; um.score = userIsA ? `${uGoals}-${oGoals}` : `${oGoals}-${uGoals}`;
    r.matches.forEach((m, i) => { if (i === bracket.userIdx) return; const [x, y] = randomScore(); m.score = `${x}-${y}`; m.winner = x > y ? m.a : m.b; });
    show({
      title: `${r.name} · resultados`, sub: 'Así quedaron todos los cruces de la ronda', content: bracketSVG(bracket),
      buttons: [{ label: 'Continuar', onClick: () => advanceRound(r) }],
    });
  }
  function advanceRound(r) {
    const winners = r.matches.map(m => m.winner);
    if (winners.length === 1) return screenChampion();
    const next = [];
    for (let i = 0; i < winners.length; i += 2) next.push({ a: winners[i], b: winners[i + 1], winner: null, score: null });
    bracket.rounds.push({ name: roundNames[bracket.roundIdx + 1], matches: next });
    bracket.roundIdx++; bracket.userIdx = next.findIndex(m => m.a === bracket.userClub || m.b === bracket.userClub);
    screenBracket();
  }
  function screenChampion() {
    trophies.push({ difficulty, clubId: userClubId, ts: Date.now() }); Store.save(trophies);
    const d = diffById(difficulty), c = clubById(userClubId);
    show({
      title: '¡Campeón del torneo!', sub: `${c.name} levanta la copa en dificultad ${d.label}`,
      content: h('div', { class: 'champion' }, h('div', { html: cupSVG(d.c1, d.c2, difficulty === 'imposible' ? c.colors[0] : null, true).replace('width="52"', 'width="110"').replace('height="68"', 'height="144"') }), crest(c, 46)),
      buttons: [{ label: 'Ver vitrina', onClick: screenTrophies }, { label: 'Menú', secondary: true, onClick: screenMenu }],
    });
    burstConfetti(true);
  }

  // ---- launching matches ----------------------------------------------------
  function launch2p() { launch({ left: { club: left2p, ctl: { type: 'human', map: KEYMAP.LEFT } }, right: { club: right2p, ctl: { type: 'human', map: KEYMAP.RIGHT } } }); }
  function launch1p() { launch({ left: { club: opponentId(), ctl: { type: 'ai', level: difficulty } }, right: { club: userClubId, ctl: { type: 'human', map: KEYMAP.SOLO } } }); }
  function launch(cfg) {
    demo = false; paused = false; ended = false;
    const a = clubById(cfg.left.club), b = clubById(cfg.right.club);
    setHeroes(a, b);
    renderer.setCrowdColors([a.colors[0], b.colors[0], a.colors[1], b.colors[1], '#c9ccd1', '#3a5c8f', '#c9a227', '#3a6b4a']);
    for (const side of ['left', 'right']) {
      const c = cfg[side].ctl;
      controllers[side] = c.type === 'ai' ? { type: 'ai', ai: new AIController(c.level) } : { type: 'human', map: c.map };
    }
    particles.clear(); renderer.clearTrail(); camera.trauma = 0; excite = 0; timeScale = 1; slowTimer = 0; hitStop = 0;
    world.resetKickoff(false); world.ballHeld = true; world.ball.reset(W / 2, 250);
    match = { phase: 'countdown', frames: 0, clubL: a, clubR: b, scoreL: 0, scoreR: 0, timeLeft: MATCH_SECONDS, overtime: false, countNum: 3, countFrac: 0, goalFlash: 0, goalClub: a, goalLabel: '', cooldown: 0, endTimer: 0, mode };
    hideOverlay(); Audio.stopMusic(); Audio.startCrowd(); showScoreboard(); updateScoreboard(true);
    Audio.sfx.whistle(false);
  }
  function endMatchState() { match = null; paused = false; demo = false; hideScoreboard(); Audio.stopCrowd(); }

  // ---- match flow ---------------------------------------------------------
  function readKeys(map) { return { left: !!keys[map.left], right: !!keys[map.right], jump: !!keys[map.jump], kick: map.kick.some(k => keys[k]) }; }
  function inputFor(side) {
    const c = controllers[side]; if (!c) return ZERO;
    if (c.type === 'ai') return c.ai.update(world, world[side], world[side === 'left' ? 'right' : 'left']);
    return readKeys(c.map);
  }
  function onGoal(e) {
    const scorer = e.side;                                    // 'left' | 'right' = the player who scored
    if (!match) { demoCool = 70; burstConfetti(false); Audio.sfx.goal(); camera.addTrauma(0.5); return; }
    if (match.phase === 'goal' || match.phase === 'ended') return;
    if (scorer === 'left') match.scoreL++; else match.scoreR++;
    const sc = scorer === 'left' ? match.clubL : match.clubR;
    match.phase = 'goal'; match.cooldown = 80; match.goalFlash = 80; match.goalClub = sc;
    match.goalLabel = (mode === '1p') ? (scorer === 'right' ? 'Gol tuyo — ' + sc.name : 'Gol del rival — ' + sc.name) : sc.name;
    burstConfetti(false); Audio.sfx.goal(); camera.addTrauma(0.6); camera.addPunch(1); hitStop = 5; slowTimer = 0.55; excite = 1;
    updateScoreboard(true);
  }
  function burstConfetti(big) {
    const m = match, cols = m ? [m.goalClub.colors[0], m.goalClub.colors[1], '#e8b84b', '#ffffff'] : ['#e8b84b', '#ffffff', '#c8102e', '#3a5c8f'];
    particles.confetti(world.ball.x, Math.max(140, world.ball.y - 40), big ? 140 : 70, cols); particles.ring(world.ball.x, world.ball.y, '#e8b84b', 70, 22);
  }
  function handleEvents() {
    const evs = world.events;
    for (let i = 0; i < evs.length; i++) {
      const e = evs[i], b = world.ball;
      switch (e.type) {
        case 'kick': {
          const ang = Math.atan2(b.vy, b.vx);
          Audio.sfx.kick(e.power); particles.sparks(e.x, e.y, 6 + (e.power | 0), ang, 0.9, 3 + e.power * 0.3); particles.ring(e.x, e.y, 'rgba(255,255,255,.9)', 22, 11);
          camera.addTrauma(0.05 + e.power * 0.01); if (e.power > 11.5) hitStop = Math.max(hitStop, 2); excite = Math.min(1, excite + 0.05); break;
        }
        case 'head': Audio.sfx.head(e.speed); particles.sparks(e.x, e.y, 4, Math.atan2(e.ny, e.nx), 1.2, 2 + e.speed * 0.3); camera.addTrauma(0.03 + e.speed * 0.004); break;
        case 'bounce': Audio.sfx.bounce(e.speed); if (e.speed > 3) particles.grass(e.x, GROUND_Y, Math.min(9, 2 + e.speed), 0.8); particles.dust(e.x, GROUND_Y, 3, 0.8); break;
        case 'bar': Audio.sfx.bar(); particles.sparks(e.x, e.y, 10, -Math.PI / 2, 2.4, 4, '#ffe9a8'); particles.ring(e.x, e.y, '#ffe9a8', 34, 14); camera.addTrauma(0.3); hitStop = Math.max(hitStop, 3); excite = Math.min(1, excite + 0.25); break;
        case 'net': Audio.sfx.net(e.speed); renderer.bulge(e.side, e.y); break;
        case 'wall': Audio.sfx.bounce(e.speed * 0.8); break;
        case 'jump': particles.dust(e.x, e.y, 5, 1); Audio.sfx.jump(); break;
        case 'land': particles.dust(e.x, e.y, Math.min(10, 3 + e.impact), 1.2); Audio.sfx.land(e.impact); break;
        case 'swing': Audio.sfx.swing(); break;
        case 'squeeze': particles.sparks(e.x, e.y, 8, -Math.PI / 2, 2.4, 3); camera.addTrauma(0.12); Audio.sfx.head(6); break;
        case 'goal': onGoal(e); break;
      }
    }
    evs.length = 0;
  }

  function tick() {
    const m = match;
    if (!m && !demo) return;
    if (hitStop > 0) { hitStop--; return; }
    if (demo) { demoTick(); return; }
    // ---- phase bookkeeping
    let live = false;
    if (m.phase === 'countdown' || m.phase === 'overtimeIntro') {
      m.frames++;
      if (m.frames < 180) { m.countNum = 3 - Math.floor(m.frames / 60); m.countFrac = (m.frames % 60) / 60; if (m.frames % 60 === 1) Audio.sfx.click(); }
      else {
        m.countNum = 0; m.countFrac = (m.frames - 180) / 30; live = true;
        if (m.frames === 180) { world.ballHeld = false; Audio.sfx.whistle(false); if (m.overtime) Audio.sfx.goal(); }
        if (m.frames >= 210) m.phase = 'play';
      }
    } else if (m.phase === 'play' || m.phase === 'goal') live = true;
    if (m.goalFlash > 0) m.goalFlash--;

    world.left.input = live ? inputFor('left') : ZERO;
    world.right.input = live ? inputFor('right') : ZERO;
    world.step();
    const b = world.ball;
    renderer.pushTrail(b); particles.update(); renderer.tickFx();
    handleEvents();
    // running dust
    for (const p of world.players) if (p.onGround && Math.abs(p.vx) > 3.2 && (world.tick % 7) === 0) particles.dust(p.x - p.dir * 6, GROUND_Y, 1, 0.5);
    // crowd excitement follows the action near the goals
    const nearGoal = clamp(1 - Math.min(Math.abs(b.x - MOUTH_L), Math.abs(b.x - MOUTH_R)) / 230, 0, 1);
    excite += ((clamp(b.speed / 18, 0, 1) * 0.4 + nearGoal * 0.45) - excite) * 0.02; excite = clamp(excite, 0, 1);
    Audio.setCrowdLevel(0.2 + excite * 0.8);

    if (m.phase === 'play' || (m.phase === 'countdown' && live)) {
      if (!m.overtime) {
        m.timeLeft -= STEP;
        if (m.timeLeft <= 0) {
          m.timeLeft = 0;
          if (m.scoreL === m.scoreR) startOvertime(); else beginEnd();
        }
      }
    }
    if (m.phase === 'goal' && --m.cooldown <= 0) {
      if (m.overtime) beginEnd();
      else { world.resetKickoff(false); renderer.clearTrail(); for (const s of ['left', 'right']) if (controllers[s].type === 'ai') controllers[s].ai.reset(); m.phase = 'play'; Audio.sfx.whistle(false); }
    }
    if (m.phase === 'ended' && --m.endTimer <= 0 && !ended) { ended = true; finishMatch(); }
    updateScoreboard(false);
  }
  function demoTick() {
    if (demoCool > 0) { if (--demoCool === 0) { world.resetKickoff(false); demoAI.left.reset(); demoAI.right.reset(); renderer.clearTrail(); } }
    world.left.input = demoAI.left.update(world, world.left, world.right); world.right.input = demoAI.right.update(world, world.right, world.left);
    world.step(); renderer.pushTrail(world.ball); particles.update(); renderer.tickFx(); handleEvents();
    excite = 0.55 + Math.sin(time * 0.7) * 0.15;
  }
  function startOvertime() {
    const m = match; m.overtime = true; m.phase = 'overtimeIntro'; m.frames = 0; m.countNum = 3;
    world.resetKickoff(true); world.ballHeld = true; world.ball.reset(W / 2, 250); world.ball.gold = true; renderer.clearTrail();
    for (const s of ['left', 'right']) if (controllers[s].type === 'ai') controllers[s].ai.reset();
    Audio.sfx.whistle(true); camera.addPunch(0.8);
  }
  function beginEnd() { const m = match; m.phase = 'ended'; m.endTimer = 100; Audio.sfx.whistle(true); camera.addPunch(0.6); Audio.setCrowdLevel(0.6); }

  function finishMatch() {
    const m = match; const L = m.scoreL, R = m.scoreR;
    Audio.stopCrowd(); hideScoreboard();
    if (mode === '2p') {
      const winner = L > R ? m.clubL : m.clubR;
      show({
        title: `Gana ${winner.name}`, sub: `Marcador final ${m.clubL.code} ${L} – ${R} ${m.clubR.code}${m.overtime ? ' · gol de oro' : ''}`,
        content: h('div', { class: 'champion' }, crest(winner, 54)),
        buttons: [{ label: 'Reiniciar partido', onClick: launch2p }, { label: 'Cambiar equipos', onClick: () => screenPick2p('left') }, { label: 'Menú', secondary: true, onClick: screenMenu }],
      });
    } else if (R > L) {
      tournamentWin(R, L);
    } else {
      show({
        title: 'Eliminado', sub: `Perdiste ${R}–${L} ante ${m.clubL.name}. El campeonato se reinicia con un sorteo nuevo.`,
        content: h('div', { class: 'champion' }, crest(m.clubL, 46)),
        buttons: [{ label: 'Nuevo campeonato', onClick: () => screenPick1p() }, { label: 'Menú', secondary: true, onClick: screenMenu }],
      });
    }
  }

  // ---- HUD ----------------------------------------------------------------
  function showScoreboard() { sb.root.style.display = 'flex'; updateTouch(); }
  function hideScoreboard() { sb.root.style.display = 'none'; sb.touch.style.display = 'none'; }
  let lastClock = '', lastScore = '';
  function updateScoreboard(force) {
    const m = match; if (!m) return;
    const clock = m.overtime ? 'EXTRA' : formatClock(m.timeLeft), score = m.scoreL + ':' + m.scoreR;
    if (force) {
      sb.code1.textContent = m.clubL.code; sb.code2.textContent = m.clubR.code;
      sb.c1.style.background = m.clubL.pattern; sb.c2.style.background = m.clubR.pattern;
      sb.pill.style.display = mode === '1p' ? 'block' : 'none'; if (mode === '1p' && bracket) sb.pill.textContent = bracket.rounds[bracket.roundIdx].name.toUpperCase();
    }
    if (clock !== lastClock || force) { sb.timer.textContent = clock; lastClock = clock; }
    if (score !== lastScore || force) { sb.s1.textContent = m.scoreL; sb.s2.textContent = m.scoreR; lastScore = score; }
  }
  function updateTouch() { sb.touch.style.display = (match && window.matchMedia && window.matchMedia('(pointer: coarse)').matches && mode === '1p') ? 'flex' : 'none'; }

  // ---- pause / help -------------------------------------------------------
  function inMatch() { return !!match && match.phase !== 'ended' && !ended; }
  function resume() { paused = false; hideOverlay(); acc = 0; last = performance.now(); btnPause.innerHTML = ICONS.pause; }
  function screenPause() {
    show({
      title: 'Pausa', sub: 'El partido está detenido',
      buttons: [{ label: 'Reanudar', onClick: resume }, { label: 'Controles', secondary: true, onClick: screenHelp }, { label: 'Salir al menú', secondary: true, onClick: screenMenu }],
    });
  }
  function screenHelp() {
    const row = (name, items) => h('div', { class: 'help-block' }, h('div', { class: 'help-title' }, name), h('div', { class: 'help-row' }, items));
    const k = t => h('kbd', null, t);
    const content = mode === '1p'
      ? [row('Tu jugador (lado derecho)', ['Mover ', k('←'), k('→'), ' · Saltar ', k('↑'), ' · Patear ', k('Espacio')])]
      : [row('Jugador izquierdo', ['Mover ', k('A'), k('D'), ' · Saltar ', k('W'), ' · Patear ', k('S'), ' / ', k('T'), ' / ', k('V')]),
         row('Jugador derecho', ['Mover ', k('←'), k('→'), ' · Saltar ', k('↑'), ' · Patear ', k('↓'), ' / ', k('P'), ' / ', k('M')])];
    content.push(h('p', { class: 'help-tip' }, 'Mantené el salto para saltar más alto. Los remates solo van hacia adelante; la cabeza sirve para defender y atacar en el aire. Esc pausa el juego.'));
    show({ title: 'Controles', content, buttons: [{ label: 'Reanudar', onClick: resume }, { label: 'Volver a pausa', secondary: true, onClick: screenPause }] });
  }
  function pauseGame(kind) {
    if (!inMatch() || paused) return;
    paused = true; btnPause.innerHTML = ICONS.play; Audio.setCrowdLevel(0);
    (kind === 'help' ? screenHelp : screenPause)();
  }

  // ---- input --------------------------------------------------------------
  const GAME_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (overlayOpen() && activeCarousel && !paused) {
      if (e.code === 'ArrowLeft') { activeCarousel.move(-1); e.preventDefault(); } else if (e.code === 'ArrowRight') { activeCarousel.move(1); e.preventDefault(); }
    }
    if ((match || demo) && !overlayOpen() && GAME_KEYS.has(e.code)) e.preventDefault();
    if (e.code === 'Escape') { if (paused) resume(); else pauseGame('pause'); }
    else if (e.code === 'KeyR' && !e.repeat && (match || overlayOpen())) { Audio.init(); screenMenu(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (inMatch() && !paused) pauseGame('pause'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && inMatch() && !paused) pauseGame('pause'); });
  btnPause.onclick = () => { Audio.init(); if (paused) resume(); else pauseGame('pause'); };
  btnHelp.onclick = () => { Audio.init(); if (paused) screenHelp(); else if (inMatch()) pauseGame('help'); else if (overlayOpen()) { /* menus have no live controls help */ } };
  btnMute.onclick = () => { Audio.init(); const m = !Audio.isMuted(); Audio.setMuted(m); btnMute.innerHTML = m ? ICONS.mute : ICONS.vol; btnMute.setAttribute('aria-pressed', String(m)); };
  [['t-left', 'ArrowLeft'], ['t-right', 'ArrowRight'], ['t-jump', 'ArrowUp'], ['t-kick', 'Space']].forEach(([id, code]) => {
    const el = $(id); if (!el) return;
    const on = ev => { ev.preventDefault(); keys[code] = true; }, off = ev => { ev.preventDefault(); keys[code] = false; };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
  });

  // ---- main loop ----------------------------------------------------------
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now; time += dt;
    if (!paused) {
      if (slowTimer > 0) { slowTimer -= dt; timeScale = 0.35; } else timeScale += (1 - timeScale) * 0.1;
      acc += dt * timeScale;
      let steps = 0;
      while (acc >= STEP && steps < 5) { tick(); acc -= STEP; steps++; }
      if (steps === 5) acc = 0;
      camera.update(dt);
    }
    const m = match;
    const view = {
      world, particles, camera, time, excite, slow: timeScale,
      celebrating: demo ? (excite > 0.5 || demoCool > 0) : !!(m && m.goalFlash > 0) || (!m && ov.root.classList.contains('loading-mode')),
      match: m,
    };
    renderer.draw(view, paused ? 1 : clamp(acc / STEP, 0, 1));
    requestAnimationFrame(frame);
  }

  async function init() {
    btnPause.innerHTML = ICONS.pause; btnHelp.innerHTML = ICONS.help; btnMute.innerHTML = ICONS.vol;
    hideScoreboard();
    try { trophies = await Store.load(); } catch (e) { trophies = []; }
    screenSplash();
    last = performance.now(); requestAnimationFrame(frame);
  }
  return { init, debug: { clubs: CLUBS, world, get match() { return match; }, tick, keys, get paused() { return paused; }, screenMenu, get bracket() { return bracket; }, renderer } };
})();

Game.init();
window.__cabezazo = Game.debug;

})();
</script>
</body>
</html>
