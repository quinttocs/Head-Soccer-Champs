<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CABEZAZO — Fútbol de Cabezas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#090c13; --panel:#12161f; --panel2:#171c28; --line:#252b3a; --ink:#eef0f4; --sub:#8b94a7; --accent:#e8b84b; --red:#c0392b; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:radial-gradient(1100px 520px at 50% -8%, rgba(232,184,75,0.10), transparent 60%), var(--bg); color:var(--ink); font-family:'Rubik',system-ui,sans-serif; -webkit-tap-highlight-color:transparent; }
  body{ display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:10px 8px 20px; }
  header{ text-align:center; margin:6px 0 10px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:4px; font-size:clamp(18px,3.6vw,26px); margin:0; text-transform:uppercase; }
  .subtitle{ font-size:10.5px; letter-spacing:3px; text-transform:uppercase; color:var(--sub); margin-top:3px; }

  #arena-wrap{ position:relative; width:100%; max-width:900px; }
  canvas#game{ display:block; width:100%; height:auto; aspect-ratio:900/520; background:#000; border:2px solid var(--line); border-radius:10px; box-shadow:0 18px 40px rgba(0,0,0,0.55); }

  #hud-buttons{ position:absolute; right:10px; bottom:10px; display:flex; gap:8px; z-index:5; }
  .hud-btn{ width:34px; height:34px; border-radius:50%; background:rgba(6,8,14,0.78); border:1px solid rgba(255,255,255,0.22); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; backdrop-filter:blur(3px); }
  .hud-btn:hover,.hud-btn:focus-visible{ border-color:var(--accent); outline:none; }

  /* overlay: opaque screens, except the splash which lets the live stadium show through */
  #overlay{ position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px 16px; background:linear-gradient(180deg,#0b0f19,#0a0d15); border-radius:10px; opacity:0; pointer-events:none; transition:opacity .18s ease; overflow:hidden; }
  #overlay.show{ opacity:1; pointer-events:auto; }
  #overlay.loading-mode{ background:linear-gradient(180deg,rgba(5,7,12,0.05) 0%,rgba(5,7,12,0.2) 40%,rgba(5,7,12,0.88) 100%); justify-content:flex-start; padding-top:clamp(70px,17%,120px); }
  #overlay.loading-mode #overlay-title{ font-size:clamp(34px,8vw,64px); letter-spacing:10px; color:#fff; text-shadow:0 4px 24px rgba(0,0,0,0.7); }
  #overlay h2{ font-family:'Oswald',sans-serif; font-weight:700; color:var(--ink); text-transform:uppercase; letter-spacing:2px; font-size:clamp(16px,2.6vw,22px); margin:0 0 4px; text-align:center; }
  #overlay-sub{ color:var(--sub); margin:0 0 12px; font-size:12px; text-align:center; max-width:520px; }
  #overlay-content{ width:100%; display:flex; flex-direction:column; align-items:center; gap:10px; max-height:calc(100% - 120px); overflow:auto; margin-bottom:12px; }
  #overlay-buttons{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn{ font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:1px; text-transform:uppercase; font-size:12.5px; padding:11px 20px; border-radius:7px; border:1px solid var(--accent); cursor:pointer; background:linear-gradient(180deg,#f2c767,var(--accent)); color:#17110a; box-shadow:0 3px 10px rgba(232,184,75,0.22); }
  .btn:hover{ filter:brightness(1.07); } .btn:active{ transform:translateY(1px); } .btn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  .btn-secondary{ background:transparent; border:1px solid #454c5e; color:var(--ink); box-shadow:none; }

  .splash-tags{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .splash-tags span{ font-family:'Oswald',sans-serif; letter-spacing:2px; text-transform:uppercase; font-size:11px; color:#d6dbe6; border:1px solid rgba(255,255,255,0.25); padding:5px 12px; border-radius:20px; background:rgba(6,8,14,0.5); }

  .menu-cards{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .mode-card{ width:200px; background:linear-gradient(160deg,#171c28,#0f131c); border:1px solid var(--line); border-radius:12px; padding:18px 16px; cursor:pointer; color:inherit; font:inherit; text-align:center; box-shadow:0 8px 18px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04); transition:transform .12s, border-color .12s; }
  .mode-card:hover,.mode-card:focus-visible{ border-color:var(--accent); transform:translateY(-2px); outline:none; }
  .mode-icon{ height:38px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
  .mode-title{ font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; font-size:15px; }
  .mode-sub{ font-size:11px; color:var(--sub); margin-top:4px; }
  .ticker-wrap{ width:100%; max-width:520px; overflow:hidden; background:#06080d; border:1px solid var(--line); border-radius:6px; padding:6px 0; }
  .ticker{ display:inline-block; white-space:nowrap; font-family:'Oswald',sans-serif; letter-spacing:2px; font-size:11px; color:var(--sub); padding-left:100%; animation:tick 26s linear infinite; }
  @keyframes tick{ to{ transform:translateX(-100%); } }

  .diff-list{ display:flex; flex-direction:column; gap:6px; width:min(100%,430px); }
  .diff-row{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; color:inherit; font:inherit; text-align:left; }
  .diff-row:hover{ border-color:#4a5164; } .diff-row.selected{ border-color:var(--accent); background:rgba(232,184,75,0.08); }
  .diff-cup{ width:40px; display:flex; justify-content:center; }
  .diff-radio{ width:14px; height:14px; border-radius:50%; border:2px solid #4a5164; flex:none; }
  .diff-row.selected .diff-radio{ border-color:var(--accent); background:radial-gradient(circle,var(--accent) 45%,transparent 50%); }
  .diff-label{ font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:2px; font-size:14px; flex:1; }
  .diff-hint{ font-size:10.5px; color:var(--sub); }

  .crest-shield{ clip-path:polygon(50% 0%,100% 20%,100% 66%,50% 100%,0% 66%,0% 20%); display:flex; align-items:center; justify-content:center; flex:none; }
  .crest-shield span{ font-family:'Oswald',sans-serif; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.9); letter-spacing:0.5px; margin-top:-8%; }
  .carousel-wrap{ display:flex; align-items:center; justify-content:center; gap:14px; }
  .arrow-btn{ width:40px; height:56px; border-radius:8px; background:var(--panel); border:1px solid var(--line); color:#fff; font-size:26px; line-height:1; cursor:pointer; }
  .arrow-btn:hover,.arrow-btn:focus-visible{ border-color:var(--accent); outline:none; }
  .carousel-mid{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .carousel-card{ width:250px; background:linear-gradient(160deg,#171c28,#0e121b); border:1px solid var(--line); border-radius:12px; padding:12px 12px 14px; text-align:center; box-shadow:0 8px 18px rgba(0,0,0,0.4); }
  .carousel-top{ display:flex; justify-content:center; margin-bottom:2px; }
  .carousel-char{ display:flex; justify-content:center; background:radial-gradient(circle at 50% 70%,rgba(255,255,255,0.07),transparent 65%); border-radius:8px; }
  .carousel-name{ font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; font-size:16px; margin-top:4px; }
  .carousel-code{ font-size:11px; color:var(--accent); letter-spacing:2px; }
  .carousel-count{ font-size:10.5px; color:var(--sub); letter-spacing:1px; }

  .vs-row{ display:flex; align-items:center; justify-content:center; gap:22px; }
  .vs-side{ display:flex; flex-direction:column; align-items:center; gap:4px; } .vs-name{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:12px; }
  .vs-mid{ font-family:'Oswald',sans-serif; font-weight:700; font-size:22px; color:var(--accent); }
  .champion{ display:flex; flex-direction:column; align-items:center; gap:10px; }

  .bracket-scroll{ max-width:100%; overflow-x:auto; padding-bottom:4px; }
  .cabinet-wrap{ width:min(100%,520px); }
  .cabinet-stats{ display:flex; justify-content:center; gap:14px; margin-bottom:8px; }
  .cab-stat{ display:flex; align-items:center; gap:4px; font-family:'Oswald',sans-serif; } .cab-cup svg{ width:24px; height:30px; }
  .cabinet{ position:relative; background:linear-gradient(180deg,#3a2616,#2a1a0e); border:6px solid #5a3a20; border-radius:6px; padding:10px 10px 4px; box-shadow:inset 0 0 30px rgba(0,0,0,0.6), 0 6px 16px rgba(0,0,0,0.5); }
  .cabinet-deco{ display:flex; justify-content:space-between; align-items:center; padding:0 6px 8px; opacity:0.95; }
  .shelf-row{ display:flex; justify-content:space-around; align-items:flex-end; min-height:72px; }
  .slot{ width:20%; text-align:center; } .slot.empty{ height:70px; } .slot-label{ font-family:'Oswald',sans-serif; font-size:9.5px; line-height:1.15; color:#efe2c9; letter-spacing:0.5px; } .slot-label span{ color:var(--accent); font-size:8.5px; text-transform:uppercase; }
  .plank{ height:7px; margin:0 -10px 6px; background:linear-gradient(180deg,#7a5330,#4a2f1a); box-shadow:0 3px 5px rgba(0,0,0,0.5); }
  .cab-empty{ text-align:center; color:var(--sub); font-size:12px; margin:8px 0 0; }

  .help-block{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 16px; width:min(100%,440px); }
  .help-title{ font-family:'Oswald',sans-serif; letter-spacing:1.5px; text-transform:uppercase; font-size:11px; color:var(--accent); margin-bottom:6px; } .help-row{ font-size:13px; color:#cfd5e2; line-height:2; }
  .help-tip{ font-size:11.5px; color:var(--sub); max-width:440px; text-align:center; margin:2px 0 0; }
  kbd{ background:#1a1f2c; border:1px solid #394155; border-bottom-width:2px; padding:1px 7px; border-radius:5px; font-family:'Rubik',sans-serif; font-weight:500; font-size:11.5px; color:var(--ink); margin:0 1px; }

  /* scoreboard below the pitch */
  #scoreboard{ display:none; flex-direction:column; align-items:center; gap:6px; margin-top:10px; }
  #round-pill{ display:none; font-family:'Oswald',sans-serif; font-weight:600; font-size:10px; letter-spacing:1.5px; color:#0c0f16; background:var(--accent); border-radius:3px; padding:2px 10px; }
  #score-row{ display:flex; align-items:stretch; background:var(--panel); border-radius:8px; overflow:hidden; border:1px solid #000; box-shadow:0 6px 16px rgba(0,0,0,0.45); }
  .team-chip{ display:flex; align-items:center; gap:8px; padding:7px 14px; background:#212530; } .team-chip.right{ flex-direction:row-reverse; }
  .team-chip .crest-shield{ width:22px; height:25px; } .team-chip .code{ font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; letter-spacing:1.5px; }
  #score-center{ background:#090a0e; padding:6px 20px; display:flex; align-items:center; gap:10px; font-family:'Oswald',sans-serif; font-weight:700; font-size:22px; border-left:1px solid #000; border-right:1px solid #000; }
  #score-center .sep{ color:#4a5164; font-weight:300; }
  #clock-pill{ background:var(--red); border-radius:12px; padding:2px 18px; font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; letter-spacing:1.5px; }

  #touch{ display:none; width:100%; max-width:900px; justify-content:space-between; gap:10px; margin-top:12px; touch-action:none; user-select:none; }
  #touch .grp{ display:flex; gap:10px; } #touch button{ width:72px; height:60px; border-radius:12px; border:1px solid #394155; background:#171c28; color:var(--ink); font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:1px; touch-action:none; }
  #touch button:active{ background:#232a3b; border-color:var(--accent); }

  .note{ font-size:10.5px; color:#5c6478; text-align:center; max-width:640px; margin:14px 0 4px; line-height:1.6; }
  @media (prefers-reduced-motion: reduce){ .ticker{ animation:none; padding-left:0; } }
</style>
</head>
<body>
<header>
  <h1>Cabezazo</h1>
  <div class="subtitle">Fútbol de cabezas</div>
</header>

<div id="arena-wrap">
  <canvas id="game" aria-label="Campo de juego"></canvas>
  <div id="hud-buttons">
    <button id="btn-mute" class="hud-btn" title="Sonido" aria-label="Silenciar" aria-pressed="false" type="button"></button>
    <button id="btn-help" class="hud-btn" title="Controles" aria-label="Controles" type="button"></button>
    <button id="btn-pause" class="hud-btn" title="Pausa (Esc)" aria-label="Pausa" type="button"></button>
  </div>
  <div id="overlay" aria-hidden="false" role="dialog">
    <h2 id="overlay-title">CABEZAZO</h2>
    <p id="overlay-sub"></p>
    <div id="overlay-content"></div>
    <div id="overlay-buttons"></div>
  </div>
</div>

<div id="scoreboard">
  <div id="round-pill">RONDA</div>
  <div id="score-row">
    <div class="team-chip"><div class="crest-shield" id="crest1"></div><div class="code" id="team1-code">---</div></div>
    <div id="score-center"><span id="scoreLeft">0</span><span class="sep">:</span><span id="scoreRight">0</span></div>
    <div class="team-chip right"><div class="crest-shield" id="crest2"></div><div class="code" id="team2-code">---</div></div>
  </div>
  <div id="clock-pill"><span id="timer">01:00</span></div>
</div>

<div id="touch">
  <div class="grp"><button id="t-left" type="button">◀</button><button id="t-right" type="button">▶</button></div>
  <div class="grp"><button id="t-jump" type="button">SALTO</button><button id="t-kick" type="button">PATEAR</button></div>
</div>

<p class="note">1 Jugador: ← → mover · ↑ saltar · Espacio patear (juegas del lado derecho). 2 Jugadores: izquierda A/D/W + S/T/V · derecha ←/→/↑ + ↓/P/M.<br>Esc pausa · R vuelve al menú · el botón ? muestra los controles.</p>

<script>
(function () {
'use strict';
/* ======================================================================
 * 01 — CONFIG: all tunable constants live here (single source of truth)
 * Units: pixels and frames (fixed 60 Hz simulation step).
 * ==================================================================== */
const W = 900, H = 520;
const GROUND_Y = 470;
const STAND_H = 112, AD_H = 14;
const TOP_LIMIT = STAND_H + AD_H;

// Goals: the "mouth" is the goal line, "back" is the rear net wall.
const MOUTH_L = 50, BACK_L = 6;
const MOUTH_R = W - 50, BACK_R = W - 6;
const CROSSBAR_Y = 305, CROSSBAR_R = 3.5;

const STEP = 1 / 60;
const MATCH_SECONDS = 60;

const PLAYER_R = 30;      // head radius (physics + render)
const LEG_BASE = 14;      // distance head-bottom -> ground when standing
const BALL_R = 15;

const TUNE = {
  // --- player locomotion -------------------------------------------------
  MAX_SPEED: 4.5,
  GROUND_ACC: 0.62, TURN_ACC: 1.05, FRICTION: 0.78, AIR_ACC: 0.26,
  GRAVITY: 0.52, FALL_MULT: 1.28, HANG_MULT: 0.72, HANG_V: 1.6, CUT_MULT: 2.1,
  JUMP_V: -9.95,
  COYOTE: 5, JUMP_BUFFER: 6, KICK_BUFFER: 7,
  // --- kick animation (frames) ------------------------------------------
  K_WIND: 5, K_STRIKE: 7, K_FOLLOW: 9, K_COOLDOWN: 3,
  FOOT_R: 14,
  // --- ball ------------------------------------------------------------
  B_GRAVITY: 0.36, B_DRAG_LIN: 0.0008, B_DRAG_QUAD: 0.00045,
  B_REST_GROUND: 0.6, B_REST_WALL: 0.5, B_REST_BAR: 0.55, B_REST_NET: 0.1,
  B_MAGNUS: 0.06, B_SPIN_DECAY: 0.994,
  B_MAX_SPEED: 16,
  SUBSTEPS: 2,
  HEAD_REST: 0.5,
};

const CEIL_Y = CROSSBAR_Y + PLAYER_R - 6;   // head can reach the crossbar, never above it


/* ======================================================================
 * 02 — UTIL: math / easing / color / deterministic RNG helpers
 * ==================================================================== */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, target, delta) => v < target ? Math.min(v + delta, target) : Math.max(v - delta, target);
const sign = v => v > 0 ? 1 : (v < 0 ? -1 : 0);
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// mulberry32: tiny seeded PRNG -> stable, repeatable procedural art per club
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const shuffle = (arr, rnd = Math.random) => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};

function parseColor(c) {
  if (c[0] === '#') {
    let h = c.slice(1);
    if (h.length === 3) h = h.split('').map(x => x + x).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const m = c.match(/-?\d+(\.\d+)?/g) || [0, 0, 0];
  return [+m[0], +m[1], +m[2]];
}
// shade(color, amt): add/subtract amt to each channel. Returns css rgb().
function shade(c, amt) {
  const [r, g, b] = parseColor(c);
  return `rgb(${clamp(Math.round(r + amt), 0, 255)},${clamp(Math.round(g + amt), 0, 255)},${clamp(Math.round(b + amt), 0, 255)})`;
}
function mix(c1, c2, t) {
  const a = parseColor(c1), b = parseColor(c2);
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
}
function rgba(c, a) { const [r, g, b] = parseColor(c); return `rgba(${r},${g},${b},${a})`; }
function luminance(c) { const [r, g, b] = parseColor(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
function formatClock(t) {
  t = Math.max(0, Math.ceil(t));
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}


/* ======================================================================
 * 03 — CLUBS: 24 clubs. Crests are original (pattern + code), characters are
 * fictional. Face traits are derived from a stable per-club seed so a club's
 * player NEVER changes between sessions.
 * ==================================================================== */
const CLUB_DATA = [
  { id: 'manutd', name: 'Manchester United', code: 'MUN', colors: ['#c8102e', '#8a0b1f'], trim: '#f4c542', pattern: 'linear-gradient(180deg,#c8102e,#8a0b1f)', skin: '#8d5a3b', hairStyle: 'short', hairColor: '#0e0e0e', beard: 'full', boot: '#ffd60a', number: '7' },
  { id: 'arsenal', name: 'Arsenal', code: 'ARS', colors: ['#c0202e', '#f5f5f5'], trim: '#111111', pattern: 'linear-gradient(90deg,#c0202e 50%,#f5f5f5 50%)', skin: '#c98a56', hairStyle: 'curly', hairColor: '#141414', beard: 'stubble', boot: '#5e5ce6', number: '8' },
  { id: 'acmilan', name: 'AC Milan', code: 'ACM', colors: ['#b3121c', '#111111'], trim: '#f5f5f5', pattern: 'linear-gradient(90deg,#b3121c 50%,#111111 50%)', skin: '#e8b48c', hairStyle: 'short', hairColor: '#3b2a1e', beard: 'stubble', boot: '#ac8e68', number: '10' },
  { id: 'dortmund', name: 'Borussia Dortmund', code: 'BVB', colors: ['#f4de00', '#d4bd00'], trim: '#111111', pattern: 'linear-gradient(180deg,#f4de00,#d4bd00)', skin: '#f0c9a0', hairStyle: 'buzz', hairColor: '#8a5a2b', beard: 'none', boot: '#ff2d55', number: '9' },
  { id: 'liverpool', name: 'Liverpool', code: 'LIV', colors: ['#b3121c', '#7a0d16'], trim: '#f5f5f5', pattern: 'linear-gradient(180deg,#b3121c,#7a0d16)', skin: '#5a3b22', hairStyle: 'curly', hairColor: '#1a1008', beard: 'full', boot: '#ffd60a', number: '11' },

  const rnd = makeRng(hashStr(c.id));
  const dark = luminance(c.skin) < 0.45;
  return Object.assign({}, c, {
    seed: hashStr(c.id),
    eye: dark ? '#24170f' : EYE_COLORS[Math.floor(rnd() * EYE_COLORS.length)],
    brow: 0.9 + rnd() * 0.7,          // eyebrow thickness

    noseLen: 0.9 + rnd() * 0.3,

});
const clubById = id => CLUBS.find(c => c.id === id);


/* ======================================================================
 * 04 — PHYSICS: deterministic fixed-step world (no DOM, fully testable)
 *  - Player: acceleration-based movement, coyote time, jump buffer,
 *            variable jump height, apex hang, fast fall, kick swing arc.
 *  - Ball:   gravity, quadratic drag, Magnus curve from spin, rolling
 *            friction coupled to spin, sub-stepped collisions.
 *  - World:  contacts (head / foot), crossbar capsules, nets, squeeze
 *            resolution so the ball can never deadlock between two heads.
 * ==================================================================== */
const KICK_TOTAL = TUNE.K_WIND + TUNE.K_STRIKE + TUNE.K_FOLLOW;
const LEG_LEN = 22;

class Ball {
  constructor() { this.reset(); }
  reset(x = W / 2, y = GROUND_Y - BALL_R - 170) {
    this.x = x; this.y = y; this.px = x; this.py = y;
    this.vx = 0; this.vy = 0; this.w = 0; this.angle = 0;
    this.gold = false; this.squash = 0; this.squashAng = 0;
    this.lastTouch = null;
  }
  get speed() { return Math.hypot(this.vx, this.vy); }
}

class Player {
  constructor(side) {
    this.side = side;
    this.dir = side === 'left' ? 1 : -1;       // attack direction
    this.R = PLAYER_R;
    this.baseY = GROUND_Y - LEG_BASE - PLAYER_R;
    this.spawnX = side === 'left' ? 220 : W - 220;
    this.club = null;
    this.input = { left: false, right: false, jump: false, kick: false };
    this.resetPose();
  }
  resetPose() {
    this.x = this.spawnX; this.y = this.baseY; this.px = this.x; this.py = this.y;
    this.vx = 0; this.vy = 0;
    this.onGround = true; this.coyote = 0; this.jumpBuf = 0; this.kickBuf = 0;
    this.prevJump = false; this.prevKick = false;
    this.kickT = -1; this.kickCd = 0; this.kickHit = false;
    this.stagger = 0; this.runPhase = 0; this.lean = 0;
    // squash & stretch spring state (render only)
    this.sx = 1; this.sy = 1; this.vsx = 0; this.vsy = 0;
    this.input = { left: false, right: false, jump: false, kick: false };
    const f = computeFoot(this);
    this.fx = f.x; this.fy = f.y; this.pfx = f.x; this.pfy = f.y; this.theta = f.theta; this.hipX = f.hipX; this.hipY = f.hipY;
  }
  get kickActive() { return this.kickT >= TUNE.K_WIND - 1 && this.kickT < TUNE.K_WIND + TUNE.K_STRIKE && !this.kickHit; }
  squashTo(sx, sy) { this.sx = sx; this.sy = sy; this.vsx = 0; this.vsy = 0; }
}

// ---- kick swing: wind-up -> accelerating strike -> follow-through ---------
function swingParams(t) {
  const A = TUNE.K_WIND, B = TUNE.K_STRIKE, C = TUNE.K_FOLLOW;
  if (t < A) { const k = t / A; return { theta: lerp(0.12, -0.62, easeOut(k)), len: LEG_LEN }; }
  if (t < A + B) {
    const k = (t - A) / B;
    return { theta: lerp(-0.62, 1.42, easeInOut(k)), len: LEG_LEN + 13 * Math.sin(k * Math.PI * 0.9 + 0.1) };
  }
  const k = Math.min(1, (t - A - B) / C);
  return { theta: lerp(1.42, 0.12, easeInOut(k)), len: LEG_LEN + 6 * (1 - k) };
}
function computeFoot(p) {
  let theta, len = LEG_LEN;
  if (p.kickT >= 0) { const s = swingParams(p.kickT); theta = s.theta; len = s.len; }
  else if (!p.onGround) { theta = 0.55; len = LEG_LEN - 1; }
  else { theta = 0.12 + Math.sin(p.runPhase) * 0.5 * Math.min(1, Math.abs(p.vx) / TUNE.MAX_SPEED); }
  const hipX = p.x + p.dir * 2;
  const hipY = p.y + PLAYER_R + LEG_BASE - LEG_LEN * Math.cos(0.12);
  const fx = hipX + p.dir * Math.sin(theta) * len;
  const fy = Math.min(hipY + Math.cos(theta) * len, GROUND_Y - 7);
  return { x: fx, y: fy, theta, hipX, hipY, len };
}

// ---- ball integration (shared by the live world and AI prediction) --------
function stepBallFree(b, dt) {
  const sp = Math.hypot(b.vx, b.vy);
  b.vy += TUNE.B_GRAVITY * dt;
  const ax = -TUNE.B_MAGNUS * b.w * b.vy, ay = TUNE.B_MAGNUS * b.w * b.vx;   // Magnus: w * rot90(v)
  b.vx += ax * dt; b.vy += ay * dt;
  const k = Math.max(0, 1 - (TUNE.B_DRAG_LIN + TUNE.B_DRAG_QUAD * sp) * dt);
  b.vx *= k; b.vy *= k;
  b.w *= Math.pow(TUNE.B_SPIN_DECAY, dt);
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.angle += b.w * dt;
}

// ---- static colliders: ground, ceiling, side walls/nets, crossbars --------
const BARS = [{ x0: BACK_L, x1: MOUTH_L }, { x0: MOUTH_R, x1: BACK_R }];
function collideBallStatic(b, dt, report) {
  const R = BALL_R;
  if (b.y + R > GROUND_Y) {
    b.y = GROUND_Y - R;
    const vn = b.vy;
    if (vn > 0) {
      const bounce = vn > 1.5;
      if (bounce && vn > 2 && report) report('bounce', { x: b.x, y: GROUND_Y, speed: vn });
      b.vy = bounce ? -vn * TUNE.B_REST_GROUND : 0;
      const slip = b.vx - b.w * R, kf = bounce ? 0.2 : 0.08 * dt;
      b.vx -= slip * kf; b.w += slip * kf * 2.5 / R;
    }
    if (Math.abs(b.vy) < 0.4) { b.vy = 0; b.vx *= 1 - 0.004 * dt; }
  }
  if (b.y - R < TOP_LIMIT) { b.y = TOP_LIMIT + R; if (b.vy < 0) b.vy *= -0.5; }
  if (b.x - R < BACK_L) {
    b.x = BACK_L + R;
    if (b.vx < 0) {
      const inNet = b.y > CROSSBAR_Y;
      if (-b.vx > 1.5 && report) report(inNet ? 'net' : 'wall', { x: b.x, y: b.y, speed: -b.vx, side: 'left' });
      b.vx *= -(inNet ? TUNE.B_REST_NET : TUNE.B_REST_WALL); b.w *= 0.7;
      if (inNet) b.vy *= 0.9;
    }
  }
  if (b.x + R > BACK_R) {
    b.x = BACK_R - R;
    if (b.vx > 0) {
      const inNet = b.y > CROSSBAR_Y;
      if (b.vx > 1.5 && report) report(inNet ? 'net' : 'wall', { x: b.x, y: b.y, speed: b.vx, side: 'right' });
      b.vx *= -(inNet ? TUNE.B_REST_NET : TUNE.B_REST_WALL); b.w *= 0.7;
      if (inNet) b.vy *= 0.9;
    }
  }
  for (let i = 0; i < 2; i++) {
    const bar = BARS[i];
    const cx = clamp(b.x, bar.x0, bar.x1), dx = b.x - cx, dy = b.y - CROSSBAR_Y;
    const rr = R + CROSSBAR_R, d2 = dx * dx + dy * dy;
    if (d2 < rr * rr) {
      let d = Math.sqrt(d2), nx, ny;
      if (d < 1e-4) { nx = 0; ny = -1; d = 0; } else { nx = dx / d; ny = dy / d; }
      b.x = cx + nx * rr; b.y = CROSSBAR_Y + ny * rr;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        const e = TUNE.B_REST_BAR;
        b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
        if (report && -vn > 1.5) report('bar', { x: b.x, y: b.y, speed: -vn });
      }
    }
  }
}

class World {
  constructor() {
    this.left = new Player('left'); this.right = new Player('right');
    this.players = [this.left, this.right];
    this.ball = new Ball();
    this.events = [];
    this.tick = 0;
    this.goalEnabled = true;
    this.ballHeld = false;
    this._report = (type, data) => this.events.push(Object.assign({ type }, data));
  }
  emit(type, data) { this.events.push(Object.assign({ type }, data)); }
  resetKickoff(gold = false) {
    this.left.resetPose(); this.right.resetPose();
    this.ball.reset(); this.ball.gold = gold;
    this.goalEnabled = true;
  }

  // ------------------------------------------------------------------ step
  step() {
    this.tick++;
    const b = this.ball;
    b.px = b.x; b.py = b.y;
    for (const p of this.players) { p.px = p.x; p.py = p.y; p.pfx = p.fx; p.pfy = p.fy; }
    this.updatePlayer(this.left); this.updatePlayer(this.right);
    this.separatePlayers();
    for (const p of this.players) {
      const f = computeFoot(p);
      p.fx = f.x; p.fy = f.y; p.theta = f.theta; p.hipX = f.hipX; p.hipY = f.hipY;
      this.animatePlayer(p);
    }
    if (!this.ballHeld) {
      const n = TUNE.SUBSTEPS;
      for (let s = 1; s <= n; s++) this.ballSub(1 / n, s / n);
      const sp = b.speed;
      if (sp > TUNE.B_MAX_SPEED) { b.vx *= TUNE.B_MAX_SPEED / sp; b.vy *= TUNE.B_MAX_SPEED / sp; }
      b.w = clamp(b.w, -0.5, 0.5);
    }
    b.squash *= 0.8;
  }

  updatePlayer(p) {
    const inp = p.input, T = TUNE;
    const jumpPressed = inp.jump && !p.prevJump; p.prevJump = inp.jump;
    const kickPressed = inp.kick && !p.prevKick; p.prevKick = inp.kick;
    if (jumpPressed) p.jumpBuf = T.JUMP_BUFFER;
    if (kickPressed) p.kickBuf = T.KICK_BUFFER;
    if (p.jumpBuf > 0) p.jumpBuf--;
    if (p.kickBuf > 0) p.kickBuf--;
    if (p.coyote > 0) p.coyote--;
    if (p.stagger > 0) p.stagger--;

    // horizontal: acceleration model
    const axis = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    const target = axis * T.MAX_SPEED * (p.stagger > 0 ? 0.55 : 1);
    let acc;
    if (p.onGround) acc = axis === 0 ? T.FRICTION : (sign(p.vx) !== 0 && sign(p.vx) !== axis ? T.TURN_ACC : T.GROUND_ACC);
    else acc = T.AIR_ACC;
    p.vx = approach(p.vx, target, acc);
    p.x += p.vx;
    const minX = BACK_L + p.R * 0.6, maxX = BACK_R - p.R * 0.6;
    if (p.x < minX) { p.x = minX; p.vx = Math.max(0, p.vx); }
    if (p.x > maxX) { p.x = maxX; p.vx = Math.min(0, p.vx); }

    // jump (buffered, with coyote time)
    if (p.jumpBuf > 0 && (p.onGround || p.coyote > 0)) {
      p.vy = T.JUMP_V; p.onGround = false; p.coyote = 0; p.jumpBuf = 0;
      p.squashTo(0.86, 1.18);
      this.emit('jump', { x: p.x, y: GROUND_Y, side: p.side });
    }

    // vertical
    const wasGround = p.onGround;
    if (!p.onGround) {
      let g = T.GRAVITY;
      if (p.vy > 0) g *= T.FALL_MULT;
      else if (Math.abs(p.vy) < T.HANG_V) g *= T.HANG_MULT;
      if (p.vy < 0 && !inp.jump) g *= T.CUT_MULT;      // variable jump height
      p.vy += g;
      p.y += p.vy;
      if (p.y >= p.baseY) {
        const impact = p.vy;
        p.y = p.baseY; p.vy = 0; p.onGround = true; p.coyote = T.COYOTE;
        p.squashTo(1 + Math.min(0.2, impact * 0.018), 1 - Math.min(0.24, impact * 0.022));
        this.emit('land', { x: p.x, y: GROUND_Y, impact, side: p.side });
      }
    } else { p.y = p.baseY; p.vy = 0; }
    if (p.y < CEIL_Y) { p.y = CEIL_Y; if (p.vy < 0) p.vy = 0; }
    if (wasGround && !p.onGround && p.vy >= 0) p.onGround = false;

    // kick state machine
    if (p.kickT >= 0) {
      p.kickT++;
      if (p.kickT >= KICK_TOTAL) { p.kickT = -1; p.kickCd = T.K_COOLDOWN; }
    } else {
      if (p.kickCd > 0) p.kickCd--;
      if (p.kickBuf > 0 && p.kickCd <= 0) { p.kickT = 0; p.kickHit = false; p.kickBuf = 0; this.emit('swing', { x: p.x, y: p.y, side: p.side }); }
    }
    if (p.onGround) p.runPhase += Math.abs(p.vx) * 0.16;
  }

  animatePlayer(p) {
    p.lean += (clamp(p.vx / TUNE.MAX_SPEED, -1, 1) * 0.13 - p.lean) * 0.25;
    const ts = p.onGround ? 1 : 1 + clamp(-p.vy * 0.012, -0.08, 0.12);
    const tx = p.onGround ? 1 : 1 - clamp(-p.vy * 0.006, -0.04, 0.06);
    p.vsy += (ts - p.sy) * 0.3; p.vsy *= 0.62; p.sy += p.vsy;
    p.vsx += (tx - p.sx) * 0.3; p.vsx *= 0.62; p.sx += p.vsx;
  }

  separatePlayers() {
    const a = this.left, b = this.right;
    const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
    const minDist = a.R + b.R - 6;
    if (dist < minDist && dist > 0.001) {
      const overlap = minDist - dist, nx = dx / dist;
      const aggA = Math.max(0, a.vx * nx) / TUNE.MAX_SPEED, aggB = Math.max(0, -b.vx * nx) / TUNE.MAX_SPEED;
      const wa = clamp(0.5 - 0.2 * (aggA - aggB), 0.3, 0.7);   // the aggressor pushes the other back
      a.x -= nx * overlap * wa; b.x += nx * overlap * (1 - wa);
    }
  }

  // ------------------------------------------------------------ ball steps
  ballSub(dt, alpha) {
    const b = this.ball;
    stepBallFree(b, dt);
    collideBallStatic(b, dt, this._report);
    const order = (this.tick & 1) ? [this.right, this.left] : [this.left, this.right];
    for (const p of order) this.contactFoot(p, alpha);
    for (const p of order) this.contactHead(p, alpha);
    this.resolveSqueeze(alpha);
    collideBallStatic(b, dt, null);
    if (this.goalEnabled) {
      if (b.x + BALL_R < MOUTH_L && b.y > CROSSBAR_Y) { this.goalEnabled = false; this.emit('goal', { side: 'right', x: b.x, y: b.y }); }
      else if (b.x - BALL_R > MOUTH_R && b.y > CROSSBAR_Y) { this.goalEnabled = false; this.emit('goal', { side: 'left', x: b.x, y: b.y }); }
    }
  }

  contactFoot(p, alpha) {
    if (!p.kickActive) return;
    const b = this.ball;
    const fx = lerp(p.pfx, p.fx, alpha), fy = lerp(p.pfy, p.fy, alpha);
    const dx = b.x - fx, dy = b.y - fy, rr = BALL_R + TUNE.FOOT_R;
    if (dx * dx + dy * dy >= rr * rr) return;
    const headX = lerp(p.px, p.x, alpha);
    if ((b.x - headX) * p.dir < -6) return;                    // kicks only go forward
    let d = Math.hypot(dx, dy), nx, ny;
    if (d < 1e-3) { nx = p.dir; ny = -0.3; d = 1; } else { nx = dx / d; ny = dy / d; }
    const footSpeed = Math.hypot(p.fx - p.pfx, p.fy - p.pfy);
    let sx = 0.55 * nx + 0.45 * p.dir, sy = 0.55 * ny - 0.45 * 0.42;
    const sl = Math.hypot(sx, sy) || 1; sx /= sl; sy /= sl;
    if (sx * p.dir < 0.3) { sx = p.dir * 0.3; sy = sy < 0 ? -Math.sqrt(0.91) : Math.sqrt(0.91); }
    if (sy > 0.15) sy = 0.15;
    const power = clamp(6.5 + footSpeed * 0.55, 7, 14.5);
    b.vx = sx * power + p.vx * 0.35;
    b.vy = sy * power + p.vy * 0.2;
    const cross = nx * sy - ny * sx;                           // contact offset -> spin (curve)
    b.w += -cross * power * 0.016;
    b.x = fx + nx * rr; b.y = fy + ny * rr;
    p.kickHit = true; b.lastTouch = p.side;
    b.squash = 0.4; b.squashAng = Math.atan2(ny, nx);
    this.emit('kick', { x: b.x, y: b.y, power, side: p.side, nx, ny });
  }

  contactHead(p, alpha) {
    const b = this.ball;
    const hx = lerp(p.px, p.x, alpha), hy = lerp(p.py, p.y, alpha);
    const dx = b.x - hx, dy = b.y - hy, rr = BALL_R + p.R;
    if (dx * dx + dy * dy >= rr * rr) return;
    let d = Math.hypot(dx, dy), nx, ny;
    if (d < 1e-3) { nx = 0; ny = -1; d = 0; } else { nx = dx / d; ny = dy / d; }
    b.x += nx * (rr - d); b.y += ny * (rr - d);
    const rvx = b.vx - p.vx, rvy = b.vy - p.vy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      const e = clamp(0.2 + (-vn) * 0.05, 0.2, TUNE.HEAD_REST + 0.1);   // soft touch cushions, hard hit rebounds
      const j = -(1 + e) * vn;
      b.vx += nx * j; b.vy += ny * j;
      const vt = rvx * -ny + rvy * nx;
      b.w += clamp(vt * 0.012, -0.1, 0.1);
      if (ny < -0.3) b.vx += p.dir * Math.min(1.2, -vn * 0.12);        // slight attacking bias on headers
      b.lastTouch = p.side;
      b.squash = Math.min(0.35, -vn * 0.05); b.squashAng = Math.atan2(ny, nx);
      if (-vn > 2.2) this.emit('head', { x: b.x - nx * BALL_R, y: b.y - ny * BALL_R, speed: -vn, side: p.side, nx, ny });
    }
    if (ny < -0.85 && Math.hypot(rvx, rvy) < 1.4) b.vx += p.dir * 0.5;  // never balance on a head: roll off forward
  }

  resolveSqueeze(alpha) {
    const L = this.left, R = this.right, b = this.ball;
    const lx = lerp(L.px, L.x, alpha), ly = lerp(L.py, L.y, alpha);
    const rx = lerp(R.px, R.x, alpha), ry = lerp(R.py, R.y, alpha);
    const lim = BALL_R + PLAYER_R + 2.5;
    if (Math.hypot(b.x - lx, b.y - ly) >= lim || Math.hypot(b.x - rx, b.y - ry) >= lim) return;
    const score = p => (p.kickT >= 0 ? 2 : 0)
      + Math.max(0, ((b.x - p.x) * p.vx > 0) ? Math.abs(p.vx) / TUNE.MAX_SPEED : 0)
      + (!p.onGround && p.vy < 0 ? 0.6 : 0);
    const sl = score(L), sr = score(R);
    const winner = sl > sr + 0.05 ? L : (sr > sl + 0.05 ? R : ((this.tick & 1) ? L : R));
    const loser = winner === L ? R : L;
    const sgn = sign(loser.x - winner.x) || winner.dir;
    b.vx = sgn * 4.6; b.vy = Math.min(b.vy, -6.6); b.y -= 2;
    loser.x += sgn * 3; loser.vx = sgn * 1.5; loser.stagger = 10;
    b.lastTouch = winner.side;
    this.emit('squeeze', { x: b.x, y: b.y });
  }
}

// future ball trajectory (no players): used by the AI to intercept and time jumps
function predictBall(ball, frames) {
  const c = { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, w: ball.w, angle: 0 };
  const out = new Array(frames);
  for (let i = 0; i < frames; i++) {
    stepBallFree(c, 1);
    collideBallStatic(c, 1, null);
    out[i] = { x: c.x, y: c.y, vx: c.vx, vy: c.vy };
  }
  return out;
}


/* ======================================================================
 * 05 — AI: decision layer that outputs the SAME input object a human would.
 *  Perception : predicted ball trajectory (same physics as the world)
 *  Modes      : HOLD    -> keep a defensive shape (ball is in the rival half)
 *               CONTEST -> intercept the ball, time jumps for headers, kick forward
 *               SAVE    -> a shot is heading into my goal: block / jump / clear
 *  Humanisation: reaction delay, positional error, skill rolls, kickoff wait.
 * ==================================================================== */
const AI_LEVELS = {
  facil:     { reactMin: 16, reactMax: 26, err: 30, jump: 0.35, kick: 0.55, gate: 0.78, kickoffWait: 80, engageBuf: -50, neutral: 25, idle: 150, threatFrames: 26 },
  normal:    { reactMin: 9,  reactMax: 15, err: 14, jump: 0.62, kick: 0.78, gate: 0.90, kickoffWait: 55, engageBuf: 0,   neutral: 55, idle: 90, threatFrames: 38 },
  dificil:   { reactMin: 4,  reactMax: 7,  err: 5,  jump: 0.92, kick: 0.97, gate: 0.995, kickoffWait: 32, engageBuf: 45,  neutral: 80, idle: 55, threatFrames: 48 },
  imposible: { reactMin: 3,  reactMax: 5,  err: 3,  jump: 0.97, kick: 1.00, gate: 1.00, kickoffWait: 24, engageBuf: 60,  neutral: 100, idle: 30, threatFrames: 60 },
};

// rise (px) of the head after t frames of a full-held jump, simulated with the real constants
const JUMP_RISE = (() => {
  const out = [0]; let vy = TUNE.JUMP_V, y = 0;
  for (let t = 1; t <= 60; t++) {
    let g = TUNE.GRAVITY;
    if (vy > 0) g *= TUNE.FALL_MULT; else if (Math.abs(vy) < TUNE.HANG_V) g *= TUNE.HANG_MULT;
    vy += g; y += vy;
    out.push(Math.max(0, -y));
    if (y >= 0) { for (let k = t + 1; k <= 60; k++) out.push(0); break; }
  }
  return out;
})();

class AIController {
  constructor(level, rnd = Math.random) {
    this.lv = AI_LEVELS[level] || AI_LEVELS.normal;
    this.rnd = rnd;
    this.input = { left: false, right: false, jump: false, kick: false };
    this.reset();
  }
  reset() {
    this.timer = 0; this.mode = 'HOLD'; this.targetX = null; this.moveDir = 0;
    this.jumpHold = 0; this.kickPulse = 0; this.pred = null; this.idleFrames = 0;
    this.wait = this.lv.kickoffWait;
  }

  update(world, me, opp) {
    const lv = this.lv;
    if (this.wait > 0) this.wait--;
    this.pred = predictBall(world.ball, 70);
    const bb = world.ball;
    if (bb.speed < 1.6 && bb.y > GROUND_Y - BALL_R - 6) this.idleFrames++; else this.idleFrames = 0;
    if (this.timer <= 0) {
      this.decide(world, me, opp);
      this.timer = lv.reactMin + Math.floor(this.rnd() * (lv.reactMax - lv.reactMin + 1));
    } else this.timer--;
    this.act(world, me, opp);
    return this.input;
  }

  // first predicted frame at which the ball would be inside my goal mouth
  threatFrame(me) {
    const pred = this.pred;
    for (let i = 0; i < pred.length; i++) {
      const q = pred[i];
      const inMouth = me.dir > 0 ? (q.x - BALL_R < MOUTH_L + 6) : (q.x + BALL_R > MOUTH_R - 6);
      if (inMouth && q.y > CROSSBAR_Y - 10) return i;
    }
    return -1;
  }

  // first predicted frame at which the ball is reachable and at a playable height
  findIntercept(me) {
    const pred = this.pred;
    for (let t = 3; t < pred.length; t++) {
      const q = pred[t];
      const need = Math.abs(q.x - me.x) / TUNE.MAX_SPEED;
      if (need <= t + 5 && q.y >= me.y - 62) return { t, x: q.x, y: q.y };
    }
    // fallback: where it first touches the floor
    for (let t = 0; t < pred.length; t++) if (pred[t].y >= GROUND_Y - BALL_R - 1) return { t, x: pred[t].x, y: pred[t].y };
    const q = pred[pred.length - 1]; return { t: pred.length - 1, x: q.x, y: q.y };
  }

  decide(world, me, opp) {
    const lv = this.lv, b = world.ball, dir = me.dir;
    const ownMouth = dir > 0 ? MOUTH_L : MOUTH_R;
    const depth = dir > 0 ? b.x - MOUTH_L : MOUTH_R - b.x;      // ball distance from MY goal line
    const half = (MOUTH_R - MOUTH_L) / 2;
    const noise = (this.rnd() - 0.5) * 2 * lv.err;
    const threatT = this.threatFrame(me);
    const approaching = b.vx * dir < -2.5 && depth < half + 250;
    // a loose ball in the neutral zone is contested by whoever is closer (prevents a dead-ball standoff)
    const neutralLoose = depth < half + lv.neutral && Math.abs(me.x - b.x) <= Math.abs(opp.x - b.x) + 15;
    const engage = depth < half + lv.engageBuf || approaching || threatT >= 0 || neutralLoose || this.idleFrames > lv.idle;

    if (threatT >= 0 && threatT < lv.threatFrames) {
      this.mode = 'SAVE';
      const it = this.findIntercept(me);
      // intercept early if possible, otherwise block just in front of the line
      const early = it.t < threatT && (it.x - ownMouth) * dir > 20;
      this.targetX = early ? it.x - dir * 18 + noise * 0.4 : ownMouth + dir * clamp(40 + noise * 0.3, 28, 90);
    } else if (this.wait > 0 && Math.abs(depth - half) < 140) {
      this.mode = 'HOLD';                                         // do not rush the kickoff drop
      this.targetX = ownMouth + dir * 170;
    } else if (engage) {
      this.mode = 'CONTEST';
      const it = this.findIntercept(me);
      const lowBall = it.y > me.y - 5;
      this.targetX = it.x - dir * (lowBall ? 46 : 8) + noise;     // stand behind the ball (head radius + reach) so it is in front
    } else {
      this.mode = 'HOLD';
      this.targetX = ownMouth + dir * (150 + clamp((depth - half) * 0.12, 0, 60)) + noise * 0.3;
    }
    this.targetX = clamp(this.targetX, BACK_L + 30, BACK_R - 30);
  }

  act(world, me, opp) {
    const lv = this.lv, inp = this.input, dir = me.dir;
    // --- movement with braking distance (no jitter / overshoot) -------------
    if (this.targetX !== null && this.rnd() < lv.gate) {
      const dx = this.targetX - me.x;
      const stopDist = me.vx * me.vx / (2 * TUNE.FRICTION);
      if (Math.abs(dx) < 5 || (sign(me.vx) === sign(dx) && Math.abs(dx) <= stopDist + 2)) this.moveDir = 0;
      else this.moveDir = sign(dx);
    }
    inp.left = this.moveDir < 0; inp.right = this.moveDir > 0;

    // --- jump: time the take-off so the head meets the ball -----------------
    if (this.jumpHold > 0) { this.jumpHold--; inp.jump = true; } else inp.jump = false;
    if (me.onGround && this.jumpHold === 0 && this.mode !== 'HOLD' && this.rnd() < lv.jump) {
      for (let t = 4; t <= 24; t++) {
        const q = this.pred[t];
        const needed = (me.y - q.y) - 18;
        if (needed < 18 || needed > 96) continue;
        if (Math.abs(q.x - (me.x + me.vx * 4)) > 40) continue;
        if (Math.abs(JUMP_RISE[t] - needed) < 7) { this.jumpHold = 16; inp.jump = true; break; }
      }
    }

    // --- kick: start the swing early so the strike lands on the ball --------
    if (this.kickPulse > 0) { this.kickPulse--; inp.kick = false; }
    else if (me.kickT < 0 && me.kickCd <= 0 && this.mode !== 'HOLD') {
      const q = this.pred[Math.min(this.pred.length - 1, TUNE.K_WIND)];
      const relX = (q.x - me.x) * dir;
      const footY = me.onGround ? GROUND_Y - 8 : me.y + 36;
      if (relX > 14 && relX < 60 && Math.abs(q.y - footY) < 30 && this.rnd() < lv.kick) { inp.kick = true; this.kickPulse = 3; }
      else inp.kick = false;
    } else inp.kick = false;
  }
}


/* ======================================================================
 * 06 — AUDIO: everything synthesised with WebAudio (no assets).
 *  - Master bus -> compressor/limiter so nothing can ever clip or saturate.
 *  - SFX:   kick, head, bounce, post/bar, net, jump/land, whistle, goal cheer.
 *  - Music: calm generative pad + soft pluck, menu only (fades when the match starts).
 *  - Crowd: very quiet noise bed that swells with the action.
 *  - Global mute (persisted in memory for the session).
 * ==================================================================== */
const Audio = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, crowdBus = null;
  let muted = false, noiseBuf = null, music = null, crowd = null;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 24; comp.ratio.value = 6; comp.attack.value = 0.004; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.8;
      master.connect(comp); comp.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.0; musicBus.connect(master);
      crowdBus = ctx.createGain(); crowdBus.gain.value = 0.0; crowdBus.connect(master);
      const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { const white = Math.random() * 2 - 1; last = (last + 0.02 * white) / 1.02; d[i] = last * 3.5; }   // brown noise
      noiseBuf = buf;
    } catch (e) { ctx = null; }
  }

  const ok = () => !!ctx && !muted;
  function noiseSrc() { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
  function env(g, t0, a, peak, d, end = 0.0001) {
    g.gain.cancelScheduledValues(t0); g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(end, t0 + a + d);
  }
  function tone(freq, t0, dur, type, vol, bus, slideTo) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    env(g, t0, 0.004, vol, dur); o.connect(g); g.connect(bus || sfxBus); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function burst(t0, dur, vol, freq, q, type = 'bandpass') {
    const s = noiseSrc(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    env(g, t0, 0.003, vol, dur); s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t0); s.stop(t0 + dur + 0.05);
  }

  const sfx = {
    kick(power = 10) { if (!ok()) return; const t = ctx.currentTime, v = clamp(0.09 + power * 0.012, 0.1, 0.26); tone(150 + power * 4, t, 0.12, 'sine', v, null, 55); burst(t, 0.06, v * 0.7, 1800, 0.8); },
    head(speed = 4) { if (!ok()) return; const t = ctx.currentTime, v = clamp(0.04 + speed * 0.012, 0.05, 0.16); tone(120 + speed * 6, t, 0.09, 'sine', v, null, 60); burst(t, 0.04, v * 0.5, 900, 0.7); },
    bounce(speed = 4) { if (!ok()) return; const t = ctx.currentTime, v = clamp(speed * 0.014, 0.03, 0.14); tone(95 + speed * 4, t, 0.1, 'sine', v, null, 50); },
    bar() { if (!ok()) return; const t = ctx.currentTime; tone(880, t, 0.5, 'triangle', 0.09); tone(1320, t, 0.35, 'sine', 0.05); burst(t, 0.03, 0.08, 3000, 1); },
    net(speed = 5) { if (!ok()) return; const t = ctx.currentTime; burst(t, 0.28, clamp(speed * 0.01, 0.03, 0.1), 700, 0.5, 'lowpass'); },
    jump() { if (!ok()) return; const t = ctx.currentTime; tone(260, t, 0.1, 'sine', 0.03, null, 420); },
    land(impact = 5) { if (!ok()) return; const t = ctx.currentTime; tone(80, t, 0.08, 'sine', clamp(impact * 0.008, 0.015, 0.07), null, 45); },
    swing() { if (!ok()) return; const t = ctx.currentTime; burst(t, 0.09, 0.025, 2600, 0.6, 'highpass'); },
    whistle(long) {
      if (!ok()) return; const t = ctx.currentTime, d = long ? 0.9 : 0.35;
      for (const f of [2850, 3050]) {
        const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = f;
        const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 38; lg.gain.value = 60; lfo.connect(lg); lg.connect(o.frequency);
        env(g, t, 0.02, 0.05, d, 0.0001); o.connect(g); g.connect(sfxBus); o.start(t); lfo.start(t); o.stop(t + d + 0.1); lfo.stop(t + d + 0.1);
      }
    },
    goal() {
      if (!ok()) return; const t = ctx.currentTime;
      // crowd swell: filtered noise with a slow attack/decay (gentle, never harsh)
      const s = noiseSrc(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'bandpass'; f.frequency.setValueAtTime(500, t); f.frequency.linearRampToValueAtTime(1100, t + 0.8); f.Q.value = 0.6;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.16, t + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
      s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + 2.6);
      [523.25, 659.25, 783.99].forEach((fr, i) => tone(fr, t + i * 0.1, 0.5, 'triangle', 0.045));
    },
    click() { if (!ok()) return; tone(520, ctx.currentTime, 0.05, 'sine', 0.03); },
  };

  // ---- generative menu music: slow chord pad + sparse pluck ---------------
  const PROG = [[220.0, 261.63, 329.63, 392.0], [174.61, 220.0, 261.63, 329.63], [261.63, 329.63, 392.0, 493.88], [196.0, 246.94, 293.66, 392.0]];
  function startMusic() {
    if (!ctx || music) return;
    const m = { step: 0, timer: null, live: [] };
    music = m;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(musicBus.gain.value, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 2.5);
    const play = () => {
      if (music !== m) return;
      const t = ctx.currentTime + 0.05, chord = PROG[m.step % PROG.length], bar = 4.6;
      chord.forEach((fr, i) => {
        const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
        o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = fr; o2.frequency.value = fr * 1.003;
        lp.type = 'lowpass'; lp.frequency.value = 900;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 1.4); g.gain.linearRampToValueAtTime(0.04, t + bar - 1.2); g.gain.linearRampToValueAtTime(0.0001, t + bar + 0.6);
        o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(musicBus);
        o.start(t); o2.start(t); o.stop(t + bar + 0.8); o2.stop(t + bar + 0.8);
      });
      for (let i = 0; i < 4; i++) {
        const fr = chord[(i * 2 + m.step) % chord.length] * 2, tt = t + 0.6 + i * 1.1;
        const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = fr;
        g.gain.setValueAtTime(0.0001, tt); g.gain.linearRampToValueAtTime(0.03, tt + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, tt + 1.4);
        o.connect(g); g.connect(musicBus); o.start(tt); o.stop(tt + 1.5);
      }
      m.step++;
      m.timer = setTimeout(play, bar * 1000 - 200);
    };
    play();
  }
  function stopMusic(fade = 0.8) {
    if (!ctx || !music) return;
    const m = music; music = null; clearTimeout(m.timer);
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(musicBus.gain.value, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + fade);
  }

  // ---- crowd bed: brown noise, band-limited, level follows excitement -----
  function startCrowd() {
    if (!ctx || crowd) return;
    const s = noiseSrc(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = 0.4; g.gain.value = 0.0;
    s.connect(f); f.connect(g); g.connect(crowdBus); s.start();
    crowdBus.gain.setValueAtTime(1, ctx.currentTime);
    crowd = { s, g };
  }
  function setCrowdLevel(x) { if (crowd && ctx) crowd.g.gain.setTargetAtTime(clamp(x, 0, 1) * 0.1, ctx.currentTime, 0.4); }
  function stopCrowd() { if (!crowd) return; const c = crowd; crowd = null; c.g.gain.setTargetAtTime(0, ctx.currentTime, 0.2); setTimeout(() => { try { c.s.stop(); } catch (e) { } }, 800); }

  function setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 0.8, ctx.currentTime, 0.05); }
  return { init, sfx, startMusic, stopMusic, startCrowd, stopCrowd, setCrowdLevel, setMuted, isMuted: () => muted };
})();


/* ======================================================================
 * 07 — FX: allocation-free particle pool + camera (trauma shake, punch zoom)
 * ==================================================================== */
class ParticleSystem {
  constructor(max = 900) {
    this.max = max; this.cursor = 0;
    this.items = [];
    for (let i = 0; i < max; i++) this.items.push({ on: false, kind: 'dust', x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 2, grow: 0, g: 0, drag: 1, rot: 0, vrot: 0, color: '#fff', add: false });
  }
  spawn(kind, x, y, vx, vy, life, size, color, o) {
    const items = this.items;
    for (let k = 0; k < this.max; k++) {                      // reuse the next free slot (ring scan)
      const p = items[this.cursor]; this.cursor = (this.cursor + 1) % this.max;
      if (!p.on) {
        p.on = true; p.kind = kind; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.maxLife = life; p.size = size; p.color = color;

  grass(x, y, n, power = 1) {

    }
  }
  sparks(x, y, n, ang, spread, speed, color = '#ffffff') {

// Trauma-based camera: shake amplitude = trauma^2 (feels natural), plus zoom "punch".
class Camera {
  constructor() { this.trauma = 0; this.t = 0; this.punch = 0; this.dx = 0; this.dy = 0; this.rot = 0; this.zoom = 1; }
  addTrauma(v) { this.trauma = Math.min(1, this.trauma + v); }
  addPunch(v) { this.punch = Math.max(this.punch, v); }
  update(realDt) {
    this.t += realDt;
    this.trauma = Math.max(0, this.trauma - realDt * 1.7);
    this.punch = Math.max(0, this.punch - realDt * 1.4);
    const s = this.trauma * this.trauma;
    this.dx = s * 14 * (Math.sin(this.t * 53) + 0.6 * Math.sin(this.t * 97 + 1));
    this.dy = s * 11 * (Math.sin(this.t * 61 + 2) + 0.6 * Math.sin(this.t * 83));
    this.rot = s * 0.02 * Math.sin(this.t * 47 + 3);
    this.zoom = 1 + easeOut(this.punch) * 0.035;
  }
  apply(ctx) {
    ctx.translate(W / 2, H / 2); ctx.scale(this.zoom, this.zoom); ctx.rotate(this.rot); ctx.translate(-W / 2 + this.dx, -H / 2 + this.dy);
  }
}


/* ======================================================================
 * 08 — SPRITES: everything is drawn procedurally ONCE into offscreen canvases
 * (supersampled) and then blitted every frame. This is what makes the game

const DPR = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);

function mk(w, h, scale, fn) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * scale); c.height = Math.ceil(h * scale);

  return c;
}

function drawHairShape(g, club, R, rnd, back) {

    g.beginPath(); g.moveTo(-R * 0.97, -R * 0.02); g.quadraticCurveTo(-R * 0.98, -R * 0.84, -R * 0.1, -R * 0.99); g.quadraticCurveTo(R * 0.7, -R * 0.95, R * 0.98, -R * 0.3);
    g.quadraticCurveTo(R * 0.7, -R * 0.62, R * 0.28, -R * 0.66); g.quadraticCurveTo(-R * 0.3, -R * 0.66, -R * 0.62, -R * 0.36); g.lineTo(-R * 0.72, -R * 0.02); g.closePath();

    g.quadraticCurveTo(R * 0.88, -R * 0.52, R * 0.55, -R * 0.62); g.quadraticCurveTo(R * 0.12, -R * 0.78, -R * 0.26, -R * 0.62);
    g.quadraticCurveTo(-R * 0.58, -R * 0.5, -R * 0.68, -R * 0.2); g.lineTo(-R * 0.74, R * (st === 'long' ? 0.35 : 0.14)); g.lineTo(-R * 0.97, R * (st === 'long' ? 0.25 : 0.0)); g.closePath(); g.fill();
    g.save(); g.clip(); strands(14, -R * 0.8, R * 0.7, -R * 1.0, -R * 0.45, true); strands(10, -R * 0.7, R * 0.6, -R * 1.0, -R * 0.5, false); g.restore();

function drawJerseyBody(g, club, R) {

  for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? club.colors[1] : club.colors[0]; g.fillRect(-w * 0.62 + i * sw, top - 4, sw + 0.5, h + 8); }
  const fabric = g.createLinearGradient(-w * 0.5, 0, w * 0.5, 0);
  fabric.addColorStop(0, 'rgba(0,0,0,0.34)'); fabric.addColorStop(0.4, 'rgba(255,255,255,0.12)'); fabric.addColorStop(1, 'rgba(0,0,0,0.3)');
  g.fillStyle = fabric; g.fillRect(-w * 0.6, top - 4, w * 1.2, h + 8);
  const hem = g.createLinearGradient(0, top, 0, top + h); hem.addColorStop(0, 'rgba(0,0,0,0)'); hem.addColorStop(1, 'rgba(0,0,0,0.3)');
  g.fillStyle = hem; g.fillRect(-w * 0.6, top, w * 1.2, h);
  g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 0.9;
  g.beginPath(); g.moveTo(-w * 0.22, top + 2); g.quadraticCurveTo(-w * 0.1, top + h * 0.5, -w * 0.2, top + h); g.stroke();
  g.beginPath(); g.moveTo(w * 0.26, top + 2); g.quadraticCurveTo(w * 0.14, top + h * 0.5, w * 0.24, top + h); g.stroke();
  g.restore();
  g.strokeStyle = club.trim; g.lineWidth = 1.5; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-w * 0.2, top - 3); g.lineTo(0, top + 5); g.lineTo(w * 0.2, top - 3); g.stroke();   // V collar
  g.fillStyle = 'rgba(0,0,0,0.4)'; g.font = "700 8px 'Oswald', Arial, sans-serif"; g.textAlign = 'center';
  g.fillText(club.number, 0.6, top + h - 2.4);
  g.fillStyle = club.trim; g.fillText(club.number, 0, top + h - 3);
  ell(g, -w * 0.52, top + 2, 4.4, 5.6, club.colors[1]); ell(g, w * 0.52, top + 2, 4.4, 5.6, club.colors[1]);     // sleeve caps
  g.strokeStyle = club.trim; g.lineWidth = 1; g.beginPath(); g.arc(-w * 0.52, top + 2, 4.2, 0.3, 2.9); g.stroke(); g.beginPath(); g.arc(w * 0.52, top + 2, 4.2, 0.2, 2.8); g.stroke();
}

function buildCharacter(club) {
  const R = PLAYER_R;
  const canvas = mk(CHAR.w, CHAR.h, SS, g => {
    g.translate(CHAR.ox, CHAR.oy);
    const rnd = makeRng(club.seed), sk = club.skin, fx = R * 0.12;
    drawHairShape(g, club, R, rnd, true);
    drawJerseyBody(g, club, R);
    // near ear (turned head: back ear visible)
    ell(g, -R * 0.93, R * 0.1, R * 0.12, R * 0.21, shade(sk, -8));
    ell(g, -R * 0.93, R * 0.11, R * 0.065, R * 0.13, rgba(shade(sk, -50), 0.45));
    // head
    const hg = g.createRadialGradient(-R * 0.36, -R * 0.4, R * 0.08, 0, 0, R * 1.06);
    hg.addColorStop(0, shade(sk, 26)); hg.addColorStop(0.45, shade(sk, 8)); hg.addColorStop(0.82, sk); hg.addColorStop(1, shade(sk, -32));
    g.fillStyle = hg; g.beginPath(); g.arc(0, 0, R, 0, 6.2832); g.fill();
    g.save(); g.beginPath(); g.arc(0, 0, R, 0, 6.2832); g.clip();
    const occ = g.createLinearGradient(-R * 0.6, -R * 0.7, R * 0.8, R * 0.9);
    occ.addColorStop(0, 'rgba(255,255,255,0.07)'); occ.addColorStop(0.45, 'rgba(0,0,0,0)'); occ.addColorStop(1, 'rgba(10,6,4,0.2)');
    g.fillStyle = occ; g.fillRect(-R, -R, R * 2, R * 2);
    ell(g, fx + R * 0.42, R * 0.28, R * 0.2, R * 0.14, rgba('#d46a5a', 0.1));                               // cheek warmth
    ell(g, -R * 0.38, R * 0.3, R * 0.2, R * 0.14, rgba('#d46a5a', 0.08));
    if (club.freckles) { for (let i = 0; i < 18; i++) { g.fillStyle = rgba('#7a4a2a', 0.3); g.fillRect(-R * 0.4 + rnd() * R * 1.0, R * 0.12 + rnd() * R * 0.2, 1.1, 1.1); } }
    g.restore();
    g.strokeStyle = rgba(shade(sk, -45), 0.5); g.lineWidth = 1.3;
    g.beginPath(); g.arc(0, 0, R - 0.6, 0, 6.2832); g.stroke();
    // jaw definition
    g.strokeStyle = rgba(shade(sk, -50), 0.15); g.lineWidth = 1.4; g.beginPath();
    g.moveTo(-R * 0.8, R * 0.38); g.quadraticCurveTo(-R * 0.4 * club.jaw, R * 0.92, R * 0.1, R * 0.94); g.quadraticCurveTo(R * 0.6 * club.jaw, R * 0.9, R * 0.88, R * 0.34); g.stroke();
    drawBeardAndStache(g, club, R, rnd, fx);
    drawNose(g, club, R, fx);
    const ey = -R * 0.06;
    drawEye(g, -R * 0.14 + fx, ey, R * 0.17, R * 0.105, club, 1);
    drawEye(g, R * 0.42 + fx, ey, R * 0.12, R * 0.098, club, 0.85);
    drawBrow(g, -R * 0.14 + fx, ey - R * 0.2, R * 0.2, club, club.browTilt, 1.5 * club.brow);
    drawBrow(g, R * 0.42 + fx, ey - R * 0.2, R * 0.15, club, -club.browTilt, 1.35 * club.brow);
    g.strokeStyle = rgba(shade(sk, -45), 0.3); g.lineWidth = 1;                                              // forehead / eye-bag hints
    g.beginPath(); g.moveTo(-R * 0.32 + fx, ey + R * 0.15); g.quadraticCurveTo(-R * 0.14 + fx, ey + R * 0.2, R * 0.02 + fx, ey + R * 0.14); g.stroke();
    drawMouth(g, club, R, fx);
    drawHairShape(g, club, R, rnd, false);
  });
  return { canvas, w: CHAR.w, h: CHAR.h, ox: CHAR.ox, oy: CHAR.oy };
}

// -------------------------------------------------------------------- boot
function buildBoot(color) {
  const c = mk(44, 30, SS, g => {
    g.translate(12, 14);
    const body = g.createLinearGradient(0, -9, 0, 9);
    body.addColorStop(0, shade(color, 38)); body.addColorStop(0.55, color); body.addColorStop(1, shade(color, -42));
    g.fillStyle = body; g.beginPath();
    g.moveTo(-10, -4); g.quadraticCurveTo(-11, -10, -2, -10); g.quadraticCurveTo(8, -10, 15, -3);
    g.quadraticCurveTo(19, 1, 16, 5); g.lineTo(-9, 5); g.quadraticCurveTo(-12, 2, -10, -4); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1; g.stroke();
    g.fillStyle = '#10141c'; g.beginPath(); g.moveTo(-10, 4); g.lineTo(16.5, 4); g.lineTo(16, 7.2); g.lineTo(-9.5, 7.2); g.closePath(); g.fill();   // sole
    g.fillStyle = '#c9ced6'; for (let i = -7; i <= 13; i += 5) g.fillRect(i, 7, 2.2, 2.6);                                                       // studs
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 0.9; for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(1 + i * 3.3, -8.4 + i * 1.3); g.lineTo(3.4 + i * 3.3, -4.3 + i * 1.3); g.stroke(); }   // laces
    g.fillStyle = 'rgba(255,255,255,0.34)'; g.beginPath(); g.ellipse(2, -6, 7, 1.8, -0.12, 0, 6.2832); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.22)'; g.beginPath(); g.moveTo(-10, -4); g.lineTo(-4, -9.5); g.lineTo(-4, 4); g.lineTo(-9, 4); g.closePath(); g.fill();
  });
  return { canvas: c, w: 44, h: 30, ox: 12, oy: 14 };
}

// -------------------------------------------------------------------- ball
function buildBall(gold) {
  const R = BALL_R, S = (R + 2) * 2;
  const white = gold ? '#f6d472' : '#f7f8fa', dark = gold ? '#7a5a10' : '#262b33', mid = gold ? '#d9ae3c' : '#dfe3e8';
  const poly = (g, cx, cy, r, rot, n = 5) => { g.beginPath(); for (let i = 0; i < n; i++) { const a = rot + i * 6.2832 / n - Math.PI / 2; i ? g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : g.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } g.closePath(); };
  const tex = mk(S, S, SS, g => {
    g.translate(S / 2, S / 2);
    g.beginPath(); g.arc(0, 0, R, 0, 6.2832); g.clip();
    g.fillStyle = white; g.fillRect(-R, -R, R * 2, R * 2);
    g.strokeStyle = rgba(dark, 0.55); g.lineWidth = 0.9;
    for (let i = 0; i < 5; i++) {
      const a = i * 1.2566 - Math.PI / 2;
      g.beginPath(); g.moveTo(Math.cos(a) * R * 0.34, Math.sin(a) * R * 0.34); g.lineTo(Math.cos(a) * R * 0.66, Math.sin(a) * R * 0.66); g.stroke();
      const b = a + 0.6283; g.beginPath(); g.moveTo(Math.cos(a) * R * 0.66, Math.sin(a) * R * 0.66); g.lineTo(Math.cos(b) * R * 0.92, Math.sin(b) * R * 0.92); g.lineTo(Math.cos(a + 1.2566) * R * 0.66, Math.sin(a + 1.2566) * R * 0.66); g.stroke();
    }
    g.fillStyle = dark; poly(g, 0, 0, R * 0.34, 0); g.fill();
    for (let i = 0; i < 5; i++) { const a = i * 1.2566 + 0.6283 - Math.PI / 2; poly(g, Math.cos(a) * R * 0.98, Math.sin(a) * R * 0.98, R * 0.3, a + Math.PI / 2); g.fill(); }
    g.fillStyle = rgba(mid, 0.35); for (let i = 0; i < 5; i++) { const a = i * 1.2566 - Math.PI / 2; g.beginPath(); g.arc(Math.cos(a) * R * 0.62, Math.sin(a) * R * 0.62, R * 0.2, 0, 6.2832); g.fill(); }
  });
  const shadeL = mk(S, S, SS, g => {
    g.translate(S / 2, S / 2);
    const sh = g.createRadialGradient(-R * 0.38, -R * 0.42, R * 0.1, 0, 0, R * 1.05);
    sh.addColorStop(0, 'rgba(255,255,255,0.28)'); sh.addColorStop(0.45, 'rgba(255,255,255,0)'); sh.addColorStop(0.8, 'rgba(10,14,24,0.22)'); sh.addColorStop(1, 'rgba(6,8,16,0.55)');
    g.fillStyle = sh; g.beginPath(); g.arc(0, 0, R, 0, 6.2832); g.fill();
    g.strokeStyle = 'rgba(15,18,26,0.85)'; g.lineWidth = 1; g.beginPath(); g.arc(0, 0, R - 0.5, 0, 6.2832); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.75)'; g.beginPath(); g.ellipse(-R * 0.36, -R * 0.4, R * 0.2, R * 0.1, -0.7, 0, 6.2832); g.fill();
  });
  return { tex, shade: shadeL, size: S };
}

// ------------------------------------------------------ shadow & crowd atlas
function buildShadow() { return mk(64, 18, SS, g => { const gr = g.createRadialGradient(32, 9, 1, 32, 9, 30); gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.translate(32, 9); g.scale(1, 0.3); g.translate(-32, -9); g.fillStyle = gr; g.beginPath(); g.arc(32, 9, 30, 0, 6.2832); g.fill(); g.restore(); }); }

const SKIN_TONES = ['#f0c9a0', '#e1b089', '#c98a56', '#8d5a3b', '#5a3b22'];
const HAIR_TONES = ['#1a1008', '#3b2a1e', '#6b4a2a', '#b08a3e', '#2a2a2a', '#7a2a1a'];
function buildCrowdAtlas(colors) {
  const atlas = [];
  colors.forEach((shirt, ci) => {
    atlas[ci] = [];
    for (let v = 0; v < 4; v++) {
      atlas[ci][v] = [0, 1, 2].map(pose => ({
        canvas: mk(16, 24, SS, g => {
          const skin = SKIN_TONES[(ci * 3 + v * 2) % SKIN_TONES.length], hair = HAIR_TONES[(ci + v * 2) % HAIR_TONES.length];
          const by = pose === 1 ? 12.5 : 10.5;
          g.fillStyle = shade(shirt, -22); g.beginPath(); g.moveTo(3, by + 11.5 - (pose === 1 ? 0 : 0)); g.lineTo(13, by + 11.5); g.lineTo(13, 23); g.lineTo(3, 23); g.fill();
          const tg = g.createLinearGradient(0, by, 0, by + 11); tg.addColorStop(0, shade(shirt, 18)); tg.addColorStop(1, shade(shirt, -14));
          g.fillStyle = tg; g.beginPath(); g.moveTo(3.2, by + 11); g.quadraticCurveTo(2.6, by, 8, by - 0.5); g.quadraticCurveTo(13.4, by, 12.8, by + 11); g.closePath(); g.fill();
          if (pose === 2) { g.strokeStyle = skin; g.lineWidth = 2.2; g.lineCap = 'round'; g.beginPath(); g.moveTo(4, by + 3); g.lineTo(1.5, by - 6); g.moveTo(12, by + 3); g.lineTo(14.5, by - 6); g.stroke(); g.fillStyle = skin; g.beginPath(); g.arc(1.5, by - 6.5, 1.5, 0, 6.2832); g.arc(14.5, by - 6.5, 1.5, 0, 6.2832); g.fill(); }
          else { g.strokeStyle = shade(shirt, -8); g.lineWidth = 2.4; g.lineCap = 'round'; g.beginPath(); g.moveTo(3.6, by + 2); g.lineTo(3, by + 8); g.moveTo(12.4, by + 2); g.lineTo(13, by + 8); g.stroke(); }
          const hg = g.createRadialGradient(6.8, by - 6, 0.5, 8, by - 4.4, 4.8); hg.addColorStop(0, shade(skin, 18)); hg.addColorStop(1, shade(skin, -20));
          g.fillStyle = hg; g.beginPath(); g.arc(8, by - 4.4, 4.2, 0, 6.2832); g.fill();
          g.fillStyle = hair; g.beginPath(); g.arc(8, by - 5.4, 4.3, Math.PI * 1.02, Math.PI * 1.98); g.fill();
          g.fillStyle = 'rgba(20,12,8,0.7)'; g.fillRect(6.2, by - 4.3, 1, 1); g.fillRect(8.8, by - 4.3, 1, 1);
        }), w: 16, h: 24,
      }));
    }
  });
  return atlas;
}


/* ======================================================================
 * 09 — RENDER: static layers are pre-rendered once; per frame we only blit
 * layers/sprites and draw the few dynamic things (crowd, net, particles, HUD).
 * Positions of moving bodies are interpolated between physics ticks.
 * ==================================================================== */
const MARGIN = 28;

class Renderer {
  constructor(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    this.chars = new Map(); this.boots = new Map();
    this.ballSpr = { w: buildBall(false), g: buildBall(true) };
    this.shadowSpr = buildShadow();
    this.far = this.buildFar(); this.pitch = this.buildPitch(); this.overlay = this.buildOverlay(); this.grainPat = null; this.grain = this.buildGrain();
    this.layoutCrowd();
    this.setCrowdColors(['#c8102e', '#1a2a5e', '#f5f5f5', '#111111', '#3a5c8f', '#c9a227', '#3a6b4a', '#8f2c3a']);
    this.time = 0; this.trail = [];
    this.net = { left: null, right: null };
  }

  // ---------------------------------------------------------------- caches
  character(club) { let c = this.chars.get(club.id); if (!c) { c = buildCharacter(club); this.chars.set(club.id, c); } return c; }
  boot(club) { let b = this.boots.get(club.id); if (!b) { b = buildBoot(club.boot); this.boots.set(club.id, b); } return b; }
  setCrowdColors(colors) { this.crowdColors = colors; this.atlas = buildCrowdAtlas(colors); }
  pushTrail(ball) { this.trail.push({ x: ball.x, y: ball.y, s: ball.speed }); if (this.trail.length > 16) this.trail.shift(); }
  clearTrail() { this.trail.length = 0; }
  bulge(side, y) { this.net[side] = { y, t: 18, max: 18 }; }
  tickFx() { for (const s of ['left', 'right']) { const n = this.net[s]; if (n && --n.t <= 0) this.net[s] = null; } }

  // ----------------------------------------------------------- static: stands
  buildFar() {
    const M = MARGIN, hgt = TOP_LIMIT + M, wid = W + M * 2;
    return mk(wid, hgt, DPR, g => {
      g.translate(M, M);
      const wall = g.createLinearGradient(0, -M, 0, TOP_LIMIT);
      wall.addColorStop(0, '#04060b'); wall.addColorStop(0.5, '#0a0e18'); wall.addColorStop(1, '#10162a');
      g.fillStyle = wall; g.fillRect(-M, -M, wid, hgt);
      const rnd = makeRng(77);
      // seating rows (upper tier, then lower tier)
      const seatRows = (y0, y1, step, sw, tones) => {
        for (let y = y0, r = 0; y < y1; y += step, r++) {
          for (let x = -4 + (r % 2) * sw * 0.5; x < W + 4; x += sw + 1.2) {
            g.fillStyle = tones[(Math.floor(x / (sw + 1.2)) + r) % tones.length];
            g.fillRect(x, y, sw, step - 1.6);
          }
          g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(0, y, W, 0.8);
        }
      };
      seatRows(14, 62, 6, 6.5, ['#18213a', '#1d2845', '#161d33', '#202c4c']);
      seatRows(76, 112, 7, 9, ['#1a2440', '#222f52', '#18203a', '#27365c']);
      const sh = g.createLinearGradient(0, 14, 0, 64); sh.addColorStop(0, 'rgba(0,0,0,0.55)'); sh.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = sh; g.fillRect(0, 14, W, 50);
      // aisles with steps
      for (let x = 90; x < W; x += 180) {
        g.fillStyle = 'rgba(10,12,18,0.85)'; g.fillRect(x - 6, 12, 12, 52); g.fillRect(x - 7, 74, 14, 38);
        for (let y = 14; y < 64; y += 4) { g.fillStyle = 'rgba(255,255,255,0.07)'; g.fillRect(x - 6, y, 12, 1); }
        for (let y = 76; y < 112; y += 5) { g.fillStyle = 'rgba(255,255,255,0.07)'; g.fillRect(x - 7, y, 14, 1); }
      }
      // walkway between tiers
      g.fillStyle = '#05070c'; g.fillRect(0, 62, W, 12);
      g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(0, 64, W, 1); g.fillStyle = 'rgba(232,184,75,0.35)'; g.fillRect(0, 72, W, 1.2);
      // vomitory tunnels
      for (const tx of [W * 0.2, W * 0.8]) {
        g.fillStyle = '#020306'; g.beginPath(); g.moveTo(tx - 22, 112); g.lineTo(tx - 22, 90); g.quadraticCurveTo(tx, 80, tx + 22, 90); g.lineTo(tx + 22, 112); g.fill();
        const tg = g.createLinearGradient(0, 88, 0, 112); tg.addColorStop(0, 'rgba(255,240,200,0.0)'); tg.addColorStop(1, 'rgba(255,240,200,0.35)'); g.fillStyle = tg; g.fillRect(tx - 16, 92, 32, 20);
      }
      // roof with trusses
      g.fillStyle = '#020307'; g.beginPath(); g.moveTo(-M, -M); g.lineTo(W + M, -M); g.lineTo(W + M, 9); g.quadraticCurveTo(W / 2, 22, -M, 9); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(120,130,160,0.22)'; g.lineWidth = 1;
      for (let x = -20; x < W + 30; x += 36) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 18, 14); g.lineTo(x + 36, 0); g.stroke(); }
      g.beginPath(); g.moveTo(-M, 14); g.quadraticCurveTo(W / 2, 26, W + M, 14); g.stroke();
      // floodlight rigs and halos
      for (const fx of [34, W - 34]) {
        g.fillStyle = '#10141f'; g.fillRect(fx - 20, 2, 40, 10);
        for (let i = 0; i < 5; i++) { g.fillStyle = '#fffbe6'; g.beginPath(); g.arc(fx - 16 + i * 8, 7, 2.3, 0, 6.2832); g.fill(); }
        g.save(); g.globalCompositeOperation = 'lighter';
        const hg = g.createRadialGradient(fx, 8, 2, fx, 8, 190); hg.addColorStop(0, 'rgba(255,248,220,0.34)'); hg.addColorStop(1, 'rgba(255,248,220,0)');
        g.fillStyle = hg; g.fillRect(fx - 190, -M, 380, 330); g.restore();
      }
      // jumbotron frame
      g.fillStyle = '#050608'; g.fillRect(W / 2 - 78, 12, 156, 38);
      g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 1.2; g.strokeRect(W / 2 - 78, 12, 156, 38);
      g.fillStyle = '#10141c'; g.fillRect(W / 2 - 6, 50, 12, 12);
      // ad board backing
      const cols = ['#0d3d8f', '#8f0d3d', '#0d8f4a', '#8f6d0d', '#5b0d8f'];
      const adW = W / 9;
      for (let i = 0; i < 9; i++) {
        const gr = g.createLinearGradient(0, STAND_H, 0, STAND_H + AD_H); gr.addColorStop(0, shade(cols[i % 5], 26)); gr.addColorStop(1, shade(cols[i % 5], -26));
        g.fillStyle = gr; g.fillRect(i * adW, STAND_H, adW - 2, AD_H);
        g.fillStyle = 'rgba(255,255,255,0.22)'; g.fillRect(i * adW, STAND_H, adW - 2, 1.2);
      }
      g.fillStyle = '#04060a'; g.fillRect(-M, TOP_LIMIT - 0.5, wid, 3);
      void rnd;
    });
  }

  // ------------------------------------------------------------- static: pitch
  buildPitch() {
    const M = MARGIN, ph = H - TOP_LIMIT, wid = W + M * 2;
    return mk(wid, ph + M, DPR, g => {
      g.translate(M, 0);
      const N = 16, tones = ['#1b6b3a', '#217a43'];
      let prev = 0;
      for (let k = 1; k <= N; k++) {
        const y = ph * Math.pow(k / N, 1.7);
        g.fillStyle = tones[k % 2]; g.fillRect(-M, prev, wid, y - prev + 1);
        prev = y;
      }
      g.fillStyle = tones[0]; g.fillRect(-M, ph, wid, M);
      const dg = g.createLinearGradient(0, 0, 0, ph); dg.addColorStop(0, 'rgba(0,0,0,0.55)'); dg.addColorStop(0.45, 'rgba(0,0,0,0.12)'); dg.addColorStop(1, 'rgba(255,255,255,0.04)');
      g.fillStyle = dg; g.fillRect(-M, 0, wid, ph + M);
      // light pools from the floodlights
      g.save(); g.globalCompositeOperation = 'lighter';
      for (const fx of [70, W - 70]) { const pg = g.createRadialGradient(fx, ph * 0.5, 4, fx, ph * 0.5, 280); pg.addColorStop(0, 'rgba(255,250,225,0.14)'); pg.addColorStop(1, 'rgba(255,250,225,0)'); g.fillStyle = pg; g.fillRect(fx - 280, 0, 560, ph + M); }
      g.restore();

        g.strokeStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.13)'; g.lineWidth = 0.6 + t * 0.7;

      g.lineWidth = 2.6; g.beginPath(); g.ellipse(W / 2, gy + 10, 120, 28, 0, 0, 6.2832); g.stroke();               // centre circle
      g.fillStyle = 'rgba(240,244,236,0.7)'; g.beginPath(); g.ellipse(W / 2, gy + 10, 5, 2, 0, 0, 6.2832); g.fill();
      g.lineWidth = 2.2;

        const bx = sx > 0 ? MOUTH_L : MOUTH_R, ex = bx + sx * 170;

        g.beginPath(); g.moveTo(bx, gy - 18); g.lineTo(bx + sx * 62, gy - 14); g.lineTo(bx + sx * 62, gy + 40); g.lineTo(bx, gy + 44); g.stroke();
      }

  }

  buildOverlay() {
    return mk(W, H, 1, g => {
      const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, 'rgba(22,38,74,0.16)'); gr.addColorStop(0.55, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(76,48,20,0.14)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);

      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.52)');

  buildGrain() {
